<div class="protoBadge">PROTOTYPE · dsh-01e.4 · throwaway</div>
<script type="application/json" id="bd-data">__BD_DATA__</script>
<script>
'use strict'
/* ================= data + derived model (bd ready semantics) ================= */
const RAW = JSON.parse(document.getElementById('bd-data').textContent)
const ISSUES = RAW.issues
const COMMENTS = RAW.comments
const byId = new Map(ISSUES.map(i => [i.id, i]))
/* Group roots are epics — any issue that is a parent (wayfinder maps and plain
   epics alike); the wayfinder:map label also rides on tickets in this store,
   so it cannot identify maps. */
const MAPS = ISSUES.filter(i => ISSUES.some(x => x.parent === i.id))

function blockersOf(id) {
  const i = byId.get(id)
  return (i.dependencies || []).filter(d => d.type === 'blocks').map(d => d.depends_on_id)
}
function childrenOf(id) { return ISSUES.filter(i => i.parent === id).map(i => i.id) }
const isClosed = i => i.status === 'closed'
const inProg = i => i.status === 'in_progress'
function bucketOf(i) {
  if (isClosed(i)) return 'closed'
  if (inProg(i)) return 'progress'
  const bs = blockersOf(i.id)
  return bs.some(b => !isClosed(byId.get(b))) ? 'blocked' : 'frontier'
}
const BUCKET_LABEL = { frontier: 'Frontier', progress: 'In progress', blocked: 'Blocked', closed: 'Done' }
const looseIssues = ISSUES.filter(i => !i.parent && !MAPS.some(m => m.id === i.id))
function mapTickets(mid) { return childrenOf(mid) }
function fmtDate(iso) { return (iso || '').slice(0, 10) }
function typeOf(i) { return ((i.labels || []).find(l => l.startsWith('wayfinder:') && l !== 'wayfinder:map') || '').slice(9) }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

/* ================= tiny DOM builder ================= */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v
    else if (k === 'html') el.innerHTML = v
    else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = !!v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v)
    else if (k === 'style') el.style.cssText = v
    else el.setAttribute(k, v)
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue
    el.append(kid.nodeType ? kid : document.createTextNode(kid))
  }
  return el
}

/* mini markdown: headings, lists, bold, inline code, links */
function md(text) {
  const lines = String(text || '').split('\n')
  const out = []
  let list = null
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
  const flush = () => { if (list) { out.push(h('ul', {}, list.map(x => h('li', { html: inline(x) })))); list = null } }
  for (const ln of lines) {
    const hd = ln.match(/^(#{2,3})\s+(.*)/)
    const li = ln.match(/^\s*[-•]\s+(.*)/)
    if (li) { (list ??= []).push(li[1]); continue }
    flush()
    if (hd) out.push(h(hd[1].length === 2 ? 'h2' : 'h3', { html: inline(hd[2]) }))
    else if (ln.trim()) out.push(h('p', { html: inline(ln) }))
  }
  flush()
  return out
}

/* ---------- layered DAG layout (prototype stand-in for dagre, dsh-01e.1) ---------- */
function layout(nodes, edges, dir) {
  const ids = new Set(nodes.map(n => n.id))
  const next = new Map(nodes.map(n => [n.id, []]))
  const indeg = new Map(nodes.map(n => [n.id, 0]))
  for (const e of edges) {
    if (!ids.has(e.from) || !ids.has(e.to)) continue
    next.get(e.from).push(e.to)
    indeg.set(e.to, indeg.get(e.to) + 1)
  }
  const layer = new Map(nodes.filter(n => indeg.get(n.id) === 0).map(n => [n.id, 0]))
  const q = [...layer.keys()]
  while (q.length) {
    const id = q.shift()
    for (const t of next.get(id)) {
      const cand = layer.get(id) + 1
      if (!layer.has(t) || layer.get(t) < cand) layer.set(t, cand)
      indeg.set(t, indeg.get(t) - 1)
      if (indeg.get(t) === 0) q.push(t)
    }
  }
  const byLayer = new Map()
  for (const n of nodes) {
    const l = layer.get(n.id) || 0
    if (!byLayer.has(l)) byLayer.set(l, [])
    byLayer.get(l).push(n)
  }
  const pred = new Map(nodes.map(n => [n.id, []]))
  for (const e of edges) if (ids.has(e.from) && ids.has(e.to)) pred.get(e.to).push(e.from)
  const pos = new Map()
  const GAP_N = 26, GAP_L = 78
  if (dir === 'LR') {
    let x = 20
    for (const l of [...byLayer.keys()].sort((a, b) => a - b)) {
      const arr = byLayer.get(l)
      arr.sort((a, b) => String(pred.get(a.id)[0] || '').localeCompare(String(pred.get(b.id)[0] || '')))
      let y = 20, maxW = 0
      for (const n of arr) { pos.set(n.id, { x, y }); y += n.h + GAP_N; maxW = Math.max(maxW, n.w) }
      x += maxW + GAP_L
    }
  } else {
    let y = 20
    for (const l of [...byLayer.keys()].sort((a, b) => a - b)) {
      const arr = byLayer.get(l)
      arr.sort((a, b) => String(pred.get(a.id)[0] || '').localeCompare(String(pred.get(b.id)[0] || '')))
      let x = 20, maxH = 0
      for (const n of arr) { pos.set(n.id, { x, y }); x += n.w + GAP_N; maxH = Math.max(maxH, n.h) }
      y += maxH + GAP_L
    }
  }
  const W = Math.max(...[...pos.values()].map(p => p.x), 0) + 260
  const H = Math.max(...[...pos.values()].map(p => p.y), 0) + 120
  return { pos, W, H }
}

function graphSvg(selIds, opts) {
  const dir = opts.dir || 'TB'
  const selSet = new Set(selIds)
  const nodes = selIds.map(id => {
    const isMap = MAPS.some(m => m.id === id)
    return { id, w: isMap ? 252 : 216, h: isMap ? 50 : 60, map: isMap }
  })
  const edges = []
  const seen = new Set()
  for (const id of selIds) {
    for (const b of blockersOf(id)) if (selSet.has(b) && !seen.has(b + '>' + id)) { seen.add(b + '>' + id); edges.push({ from: b, to: id }) }
    for (const c of childrenOf(id)) if (selSet.has(c) && !seen.has(id + '>' + c)) { seen.add(id + '>' + c); edges.push({ from: id, to: c, pc: true }) }
  }
  const { pos, W, H } = layout(nodes, edges, dir)
  const nById = new Map(nodes.map(n => [n.id, n]))
  const inEgo = id => {
    if (!opts.focus || opts.focus === id) return true
    const f = opts.focus
    return blockersOf(f).includes(id) || blockersOf(id).includes(f) || byId.get(f)?.parent === id || byId.get(id)?.parent === f
  }
  const svgNS = 'http://www.w3.org/2000/svg'
  const mk = (t, at) => { const e = document.createElementNS(svgNS, t); for (const [k, v] of Object.entries(at)) e.setAttribute(k, v); return e }
  const svg = mk('svg', { class: 'graphSvg', viewBox: `0 0 ${W} ${H}` })
  const rootG = mk('g', {})
  svg.append(rootG)
  if (opts.pan) rootG.setAttribute('transform', `translate(${S.panX},${S.panY}) scale(${S.zoom})`)
  const defs = mk('defs', {})
  for (const id of ['arr-blocks', 'arr-pc']) {
    const m = mk('marker', { id, viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse' })
    m.append(mk('path', { d: 'M 0 1 L 9 5 L 0 9 z' }))
    defs.append(m)
  }
  rootG.append(defs)
  const anchor = (id, side) => {
    const n = nById.get(id), p = pos.get(id)
    return side === 'out'
      ? (dir === 'LR' ? { x: p.x + n.w, y: p.y + n.h / 2 } : { x: p.x + n.w / 2, y: p.y + n.h })
      : (dir === 'LR' ? { x: p.x, y: p.y + n.h / 2 } : { x: p.x + n.w / 2, y: p.y })
  }
  for (const e of edges) {
    const a = anchor(e.from, 'out'), b = anchor(e.to, 'in')
    const path = dir === 'LR'
      ? `M${a.x},${a.y} C${a.x + 46},${a.y} ${b.x - 46},${b.y} ${b.x},${b.y}`
      : `M${a.x},${a.y} C${a.x},${a.y + 42} ${b.x},${b.y - 42} ${b.x},${b.y}`
    rootG.append(mk('path', { d: path, class: 'gEdge' + (e.pc ? ' pc' : '') + (opts.focus && inEgo(e.from) && inEgo(e.to) ? ' hi' : ''), markerEnd: `url(#${e.pc ? 'arr-pc' : 'arr-blocks'})` }))
  }
  for (const n of nodes) {
    const i = byId.get(n.id)
    const p = pos.get(n.id)
    const g = mk('g', {
      class: 'gNode' + (n.map ? ' mapNode' : '') + ((S.sel === n.id || S.focus === n.id) ? ' sel' : '') + (opts.focus && !inEgo(n.id) ? ' dimmed' : ''),
      transform: `translate(${p.x},${p.y})`,
    })
    const b = bucketOf(i)
    g.append(mk('rect', { class: 'box', width: n.w, height: n.h, rx: 9 }))
    g.append(mk('rect', { x: 0, y: 0, width: 3.5, height: n.h, rx: 2, fill: `var(--gstat-${b})` }))
    const tx = mk('text', { x: 14, y: n.map ? 21 : 19, class: 'title' })
    tx.textContent = (n.map ? '▣ ' : '') + (i.title.length > 30 ? i.title.slice(0, 30) + '…' : i.title)
    g.append(tx)
    const t2 = mk('text', { x: 14, y: n.map ? 38 : 37, class: 'id' })
    t2.textContent = i.id + ' · ' + BUCKET_LABEL[b] + ' · P' + i.priority
    g.append(t2)
    g.addEventListener('click', () => (opts.onNode || (id => { S.sel = id; render() }))(n.id))
    rootG.append(g)
  }
  if (opts.pan) attachPan(svg, rootG)
  return { svg, W, H }
}

function attachPan(svg, rootG) {
  let drag = null, raf = 0
  const apply = () => rootG.setAttribute('transform', `translate(${S.panX},${S.panY}) scale(${S.zoom})`)
  const resetView = () => { S.zoom = S.tz = 1; S.panX = S.panY = S.tpx = S.tpy = 0; apply() }
  S.tz ??= S.zoom; S.tpx ??= S.panX; S.tpy ??= S.panY
  const step = () => {
    raf = 0
    if (!svg.isConnected) return // render() rebuilt the DOM; stop the stale loop
    const k = 0.16 // per-frame easing toward the target view
    S.zoom += (S.tz - S.zoom) * k
    S.panX += (S.tpx - S.panX) * k
    S.panY += (S.tpy - S.panY) * k
    apply()
    if (Math.abs(S.tz - S.zoom) > .001 || Math.abs(S.tpx - S.panX) > .5 || Math.abs(S.tpy - S.panY) > .5) raf = requestAnimationFrame(step)
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(step) }
  svg.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, px: S.panX, py: S.panY }; svg.classList.add('panning') })
  svg.addEventListener('mousemove', e => {
    if (!drag) return
    S.panX = S.tpx = drag.px + (e.clientX - drag.x)
    S.panY = S.tpy = drag.py + (e.clientY - drag.y)
    apply()
  })
  window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('panning') })
  svg.addEventListener('wheel', e => {
    e.preventDefault()
    // continuous factor: trackpads send small deltas, mouse wheels large notches
    const nz = Math.min(3, Math.max(.25, S.tz * Math.exp(-e.deltaY * .0016)))
    const ctm = typeof svg.getScreenCTM === 'function' ? svg.getScreenCTM() : null
    const gctm = ctm && typeof rootG.getScreenCTM === 'function' ? rootG.getScreenCTM() : null
    if (ctm && gctm && typeof DOMPoint === 'function') {
      // anchor the graph point under the cursor: svgPt = pan + zoom * graphPt
      const sp = new DOMPoint(e.clientX, e.clientY).matrixTransform(ctm.inverse())
      const gp = new DOMPoint(e.clientX, e.clientY).matrixTransform(gctm.inverse())
      S.tz = nz; S.tpx = sp.x - nz * gp.x; S.tpy = sp.y - nz * gp.y
    } else {
      S.tz = nz
    }
    kick()
  }, { passive: false })
  svg.resetView = resetView
}

function renderAList() {

  }

    if (!tickets.length) return
    const openG = S.openGroups.has(m.id)
    const buckets = { frontier: [], progress: [], blocked: [], closed: [] }
    for (const t of tickets) buckets[bucketOf(t)].push(t)
    const done = buckets.closed.length, active = tickets.length - done
    out.push(h('button', {

    },
      h('span', { class: 'caret' }, '▼'),
      h('span', { class: 'gt' }, m.title),
      h('span', { class: 'chip' }, active + ' active'),
      done ? h('span', { class: 'countQuiet' }, done + ' done') : null))
    if (openG) {
      for (const b of ['frontier', 'progress', 'blocked']) {
        if (!buckets[b].length) continue
        out.push(h('div', { class: 'subHead' }, BUCKET_LABEL[b], h('span', { class: 'n' }, buckets[b].length)))
        out.push(...buckets[b].map(i => rowEl(i)))
      }
      if (buckets.closed.length) {
        const key = m.id + ':c'
        const openC = S.openGroups.has(key)
        out.push(h('button', {
          class: 'subHead asBtn',
          onClick: () => { openC ? S.openGroups.delete(key) : S.openGroups.add(key); render() },
        }, h('span', { style: 'font-size:9px' }, openC ? '▾' : '▸'), 'Done', h('span', { class: 'n' }, buckets.closed.length)))
        if (openC) out.push(...buckets.closed.map(i => rowEl(i)))
      }
    }
  }
  const order = MAPS.some(m => m.id === S.mapFilter) ? [S.mapFilter, ...MAPS.filter(m => m.id !== S.mapFilter).map(m => m.id)] : MAPS.map(m => m.id)
  for (const mid of order) renderMapGroup(byId.get(mid))
  const loose = looseIssues.filter(match)
  if (loose.length) {
    out.push(h('button', {
      class: 'groupHead' + (S.openGroups.has('__loose') ? '' : ' closed'),
      onClick: () => { S.openGroups.has('__loose') ? S.openGroups.delete('__loose') : S.openGroups.add('__loose'); render() },
    }, h('span', { class: 'caret' }, '▼'), h('span', { class: 'gt' }, 'Standalone issues'), h('span', { class: 'chip' }, loose.length)))
    if (S.openGroups.has('__loose')) out.push(...loose.map(i => rowEl(i)))
  }
  return out
}

/* ================= variant B ================= */
function renderB() {
  const ids = S.focus
    ? [S.focus, ...blockersOf(S.focus), ...ISSUES.filter(x => blockersOf(x.id).includes(S.focus)).map(x => x.id), byId.get(S.focus).parent, ...childrenOf(S.focus)].filter(Boolean)
    : [S.mapFilter, ...mapTickets(S.mapFilter)]
  const g = graphSvg(ids, { dir: 'LR', pan: true, focus: S.focus, onNode: id => { S.focus = id; S.sel = id; S.zoom = S.tz = 1; S.panX = S.panY = S.tpx = S.tpy = 0; render() } })
  const canvas = h('div', { class: 'vbCanvas' }, g.svg, legendEl(),
    h('div', { class: 'graphHint' }, S.focus ? 'Focus view · 1-hop ego graph' : 'Scroll to zoom · drag to pan · click a node to focus'))
  if (S.focus) canvas.append(h('div', { class: 'vbDetailCard' }, detailEl(byId.get(S.focus), { closable: true })))
  const frontierAll = ISSUES.filter(i => bucketOf(i) === 'frontier')
  return h('div', { class: 'vbRoot' },
    h('div', { class: 'toolbar', style: 'padding-bottom:6px' },
      MAPS.map(m => h('button', {
        class: 'mapChip' + (S.mapFilter === m.id ? ' on' : ''), title: m.title,
        onClick: () => { S.mapFilter = m.id; S.focus = null; S.zoom = S.tz = 1; S.panX = S.panY = S.tpx = S.tpy = 0; render() },
      }, m.title)),
      S.focus
        ? h('button', { class: 'btn btnGhost', style: 'margin-left:auto;height:28px;padding:3px 12px', onClick: () => { S.focus = null; render() } }, '← Back to full graph')
        : h('span', { class: 'countQuiet', style: 'margin-left:auto' }, MAPS.length + ' groups')),
    canvas,
    h('div', { class: 'vbQueue' },
      h('span', { class: 'vbQueueH' }, 'Frontier queue · ' + frontierAll.length),
      frontierAll.map(i => h('button', {
        class: 'qChip' + (S.focus === i.id ? ' on' : ''),
        onClick: () => { S.focus = i.id; S.sel = i.id; render() },
      }, h('span', { class: 'statDot st-frontier' }), h('span', { class: 'mono dim' }, i.id), h('span', { class: 't' }, i.title)))))
}

/* ================= variant C ================= */
function renderC() {
  const cols = ['frontier', 'progress', 'blocked', 'closed']
  const isMap = id => MAPS.some(m => m.id === id)
  const board = h('div', { class: 'vcBoard' },
    cols.map(b => {
      const lanes = new Map([...MAPS.map(m => [m.id, []]), ['__loose', []]])
      for (const i of ISSUES) {
        if (isMap(i.id) || bucketOf(i) !== b) continue
        const key = i.parent && lanes.has(i.parent) ? i.parent : '__loose'
        lanes.get(key).push(i)
      }
      const total = [...lanes.values()].reduce((a, c) => a + c.length, 0)
      const colEl = h('div', { class: 'vcCol' },
        h('div', { class: 'vcColHead' }, h('span', { class: 'statDot st-' + b }), BUCKET_LABEL[b], h('span', { class: 'countQuiet' }, total)))
      const body = h('div', { class: 'vcColBody' })
      for (const [mid, items] of lanes) {
        if (!items.length) continue
        body.append(h('div', { class: 'laneHead' }, mid === '__loose'
          ? h('span', {}, 'Standalone issues')
          : h('span', { title: byId.get(mid).title }, '▣ ' + byId.get(mid).title)))
        for (const i of items) {
          body.append(h('button', { class: 'card', onClick: () => { S.drawer = i.id; S.sel = i.id; render() } },
            h('div', { class: 'cardTitle' }, i.title),
            h('div', { class: 'cardMeta' }, h('span', { class: 'mono dim' }, i.id), prioMark(i), typeChip(i), attnChip(i))))
        }
      }
      colEl.append(body)
      return colEl
    }))
  const root = h('div', { class: 'vcRoot' },
    h('div', { class: 'toolbar' },
      h('span', { class: 'countQuiet' }, 'Columns by status · swimlanes by epic · click a card for detail + ego graph'),
      h('span', { class: 'countQuiet', style: 'margin-left:auto' }, ISSUES.length + ' issues')),
    board)
  if (S.drawer && byId.get(S.drawer)) {
    const i = byId.get(S.drawer)
    const egoIds = [i.id, ...blockersOf(i.id), ...ISSUES.filter(x => blockersOf(x.id).includes(i.id)).map(x => x.id), i.parent, ...childrenOf(i.id)].filter(Boolean)
    const g = graphSvg(egoIds, { dir: 'TB', focus: i.id })
    const vw = Math.min(g.W, 470), vh = Math.min(g.H, 280)
    g.svg.setAttribute('viewBox', `0 0 ${g.W} ${g.H}`)
    g.svg.setAttribute('preserveAspectRatio', 'xMidYMin meet')
    g.svg.style.width = '100%'
    g.svg.style.height = vh + 'px'
    root.append(
      h('div', { class: 'drawerMask', onClick: () => { S.drawer = null; render() } }),
      h('div', { class: 'drawer' },
        h('button', { class: 'iconBtn', style: 'position:absolute;top:10px;right:10px', onClick: () => { S.drawer = null; render() } }, '✕'),
        detailEl(i),
        h('div', { class: 'dtSection' }, h('div', { class: 'dtSectionH' }, 'Ego graph · 1 hop'), h('div', { class: 'egoWrap' }, g.svg))))
  }
  return root
}

/* ================= switcher + demo panel ================= */
function renderSwitcher() {
  const keys = Object.keys(VARIANT_NAMES)
  const cur = keys.indexOf(S.variant)
  const go = d => { S.variant = keys[(cur + d + keys.length) % keys.length]; S.zoom = S.tz = 1; S.panX = S.panY = S.tpx = S.tpy = 0; render() }
  return h('div', { class: 'switcher' },
    h('button', { onClick: () => go(-1), 'aria-label': 'Previous variant' }, '←'),
    h('span', { class: 'lbl' }, S.variant + ' — ' + VARIANT_NAMES[S.variant]),
    h('button', { onClick: () => go(1), 'aria-label': 'Next variant' }, '→'))
}
function renderDemoPanel() {
  return h('div', { class: 'demoPanel' },
    h('label', {}, 'Dark theme', h('input', { type: 'checkbox', checked: S.dark, onChange: ev => { S.dark = ev.target.checked; render() } })),
    h('label', {}, 'Data state', h('select', { onChange: ev => { S.dataState = ev.target.value; render() } },
      h('option', { value: 'ok' }, 'Real data'),
      h('option', { value: 'loading' }, 'Loading'),
      h('option', { value: 'empty' }, 'Empty store'),
      h('option', { value: 'nobd' }, 'bd missing'),
      h('option', { value: 'nobeads' }, 'No .beads/'))))
}

/* keyboard variant cycling (not in inputs) */
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const keys = Object.keys(VARIANT_NAMES)
  S.variant = keys[(keys.indexOf(S.variant) + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length]
  render()
})

render()
</script>
</body>
</html>
