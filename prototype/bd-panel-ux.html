 page 12, JsonTree 12, workspace Rows 6, InputBar 4, HoverCard 3, trajectory shadows 2, plus singles). Dark corners: shiki colors from ui-theme shiki.css (--shiki-token-* pairs); KaTeX inherits label color (no own palette); scrollbars fully token-driven via scrollbar.css; markdown via ui-primitives markdown/* + --dsw-alias-markdown-*. Restyle split: token-reachable ~80-90% of visual surface by editing the 5 ui-theme sheets (alias remap is the single biggest lever); per-package edits needed for boot-page.module.css, JsonTree palette, ansi.ts, ~40 hardcoded literals, and any geometry/spacing/typography change (all 106 module files, 62% concentrated in ui-primitives 4.5k + ui-conversation 2.9k + ui-trajectory 2.6k LOC).\nFindings: branch research/dsh-ui-inventory, file research-notes/dsh-ui-inventory.md\n","created_at":"2026-08-25T22:30:37Z"}],"dsh-01e.2":[{"id":"01a03ccb-e3bc-7dde-8610-8be05e5783c5","issue_id":"dsh-01e.2","author":"Sereja","text":"Resolution (confirmed with the driving dev):\n1. Canonical data source: `bd list --all --json -n 0` — full issue objects with inline dependencies[]/parent; comment bodies fetched per-issue via `bd show --json --include-comments` only on selection. `bd graph` views stay display formats; if the UI wants topological layers, the host computes them from the JSON edges.\n2. Package shape: one host plugin package exposing a single cwd-scoped service (list/show) + one client UI package. No Service Definition/Provider/Consumer split — exactly one consumer (the panel) and one backend (bd) exist today; extract the seam when a second tracker backend appears.\n3. Liveness and wire: v1 = client pull-poll over the existing client-to-host RPC while the panel is visible (default 5s, paused when hidden or closed); the host spawns bd per call (~0.31 s locally, flat process-startup cost). fs.watch on .beads/last-touched plus a downlink push signal is a deferred optimization if polling cost ever matters.\n4. Config and failures: validated Config with bdBinary (default 'bd' from PATH) and pollIntervalMs (default 5000); bd missing = error state with install hint; no .beads/ in session cwd = empty state; the store follows the session cwd.\nGaps honored from the bd research: always -n 0 (default limit 50), treat conditionally-absent fields (assignee/parent/started_at) as null, argv-style invocation (no shell string), pin to documented JSON fields only.","created_at":"2026-08-26T06:39:50Z"}],"dsh-01e.3":[{"id":"01a03d54-9de7-78e1-a7d6-c138d2150454","issue_id":"dsh-01e.3","author":"Sereja","text":"Resolution (confirmed with the driving dev; direction redirected mid-ticket):\n\n**REDIRECT:** the panel is not a fourth AppFrame column — it is a tab in the existing conversation view ring (Chat / Trajectory / Beads). AppFrame, columns.ts, layout stores, ctx.layout, and ui-sidebar are untouched.\n\n1. **Slot:** one entry in the existing `conversation.view` list slot (session scope, already declared by ui-conversation's body entry). Registration follows the ui-trajectory pattern: `ctx.slots.inject('conversation.view', ...)` with `id: 'beads'`, `order: 20` (after chat=0, trajectory=10), locale-bound label \"Beads\" (proper noun, identical in zh and en; translating to 「任务」would collide with tasks/todo vocabulary). Owner props stay empty; per-session view state (selected ticket, list/graph mode) lives in the plugin's own entry store (chat-store pattern). No child slots in v1 — one package owns the whole view; no second consumer exists for internal seats.\n\n2. **Availability (no `.beads/` in session cwd):** the tab renders grey and non-clickable with a tooltip (「此仓库没有 beads数据」). Mechanism: a `disabled()` registration option projected into `ViewTab.disabled`; the tab strip renders disabled entries without onClick; a re-registration on availability flip bumps the slot version and redraws. Default before the async host probe answers: disabled — in a beads repo the tab flashes grey briefly then activates (probe fires on session attach, often before first strip render); a clickable ghost in non-beads repos is avoided. If the store disappears mid-session while Beads is the active view: auto-return to Chat (`resolveActiveView` skips disabled tabs; the persisted view id survives, so the tab reactivates when the store returns).\n\n3. **Blank-session coverage:** the view ring exists only for non-blank sessions; the board is reachable only inside a live session. Accepted — the wayfinder flow always runs inside an agent session (the store follows the session cwd).\n\n4. **Package:** `@deepseek-ai/dsh-client-ui-beads` (one UI plugin package: tab + list/graph/detail inside). Chinese product copy, semantic `--dsw-*` alias tokens.\n\n5. **Regression surface:** one new package + one registration + locale dictionaries. ui-conversation gains the `ViewTab.disabled` projection and the disabled-skip in `resolveActiveView` (small contract extension, snapshotted). Assembled browser output changes (third tab) → one intentional `DSH_SNAPSHOT=refresh`, replay thereafter.\n\n**Superseded by the redirect:** fourth-column geometry, concession-chain position, TASKS_* clamps, two-width reading mode, details/tasks coexistence, sidebar-footer toggle, persistence/deep links (nothing existed to preserve — the layout store is transient and stays transient in v1).\n","created_at":"2026-08-26T09:09:11Z"}],"dsh-01e.1":[{"id":"01a03cca-17dd-7d5d-94fd-b1b3a4f4ecde","issue_id":"dsh-01e.1","author":"Sereja","text":"Resolution: use @dagrejs/dagre v3 (3.1.1, MIT, ESM 48.6 KB, one internal dep @dagrejs/graphlib) in dependencies, bundled privately into the panel plugin's lib/client.js; rendering stays ours (React SVG, typed edges blocks vs parent-child, --dsw-* tokens). Deletes ~150 lines of owned layout code and their 100%-coverage obligation — the dependency-over-hand-rolling rule applies squarely. Rejected: elkjs (1.61 MB GWT-transpiled, no ESM exports, kieler/elkjs#6), cytoscape/vis-network (1.1 MB+ imperative canvas libs fighting the slot system), @xyflow/react (canvas takeover, overkill for a read-mostly 50-node panel). Fallback ladder if the prototype fails: d3-dag (142 KB ESM, 4 runtime deps), then the incumbent hand-rolled topological-column layout (~150 lines, full coverage). Evidence: bundlephobia @dagrejs/dagre@3.1.0, mermaid flowchart engine, React Flow auto-layout docs.","created_at":"2026-08-26T06:37:52Z"}],"dsh-ood.4":[{"id":"01a03b50-939f-7c63-886d-e1c9cc51d428","issue_id":"dsh-ood.4","author":"Sereja","text":"## Resolution — locked mapping\n\nDecided 2026-08-26, grilling over the drafted table (inputs: research/ow-design-extract, research/dsh-ui-inventory, research/dsh-theme-mechanics).\n\n1. **Canon source: DESIGN.md wins** wherever the OW implementation diverges. Locked values: Work Cobalt `#2E62D6` light / `#8CAAF2` dark (not blue-600 / #4c8dff); Muted Slate `#5B616B` / `#9AA1AB`; Faint Steel `#9AA1AA` / `#62686F`; Amber ink `#B45309`. Each divergence gets a source-comment in design-platform.css.\n\n2. **Ramps die in one stroke.** `--dsw-static-blue-*` (12 vars), `--dsw-static-deepseek-*` (11), and the duplicate gray ramps retire in the same foundation change as the OW tokens land. One OW-anchored Zinc ramp survives (paper / panel / ink / muted / faint / hairline / hairline-strong + supporting steps); the whole `--dsw-alias-*` layer re-points onto it atomically. No staged coexistence, no surviving logo-blue tokens.\n\n3. **Status tokens are quads**: `ink / soft / line` for ok (green), warn (amber), danger (red), info (teal) in both themes, token-for-token. Missing DESIGN.md values (amber line, red soft, teal where absent) derive via the OW badge recipe — soft tint bg + tinted 1px border + deep ink text. Saturated status fills are banned outright; checked toggles are Cobalt, never green.\n\n4. **New layers as composite tokens**: seven `--dsw-static-text-*` steps (22/18/15/13/12/11/10 px with the locked weight/line-height/tracking triples, usable as `font:` shorthand) + `--dsw-static-radius-control/panel/badge` (8/14/9999px) + `--dsw-static-shadow-float` (floating layers only; resting shadows die) + motion vars (≈130ms hover, spring-approximating cubic-bezier — true springs are JS, out of token scope).\n\n5. **Assistant chat bubble**: neutral solid `#E9EBF0` light / `#2E3138` dark with ink text (new `--dsw-static-solid`/`-on-solid`). Cobalt is never a large fill. Current deepseek-50/200 bubble tokens die with the ramp.\n\n6. **Scope guard — the 12 token-bypass sites from dsh-ood.3 are NOT executed by this mapping.** alias re-pointing only; boot-page, JsonTree, HoverCard, OnboardingSurface, InputBar, ContextMeter, Rows, TrajectoryTable, katex-error, ansi.ts, shiki.css stay literal. Deferred to a post-prototype cleanup pass (map fog entry created).\n","created_at":"2026-08-25T23:45:32Z"}],"dsh-ood.5":[{"id":"01a03d69-6e19-753f-8317-0bbc51b3558a","issue_id":"dsh-ood.5","author":"Sereja","text":"## Resolution — prototype reacted to\n\nVerdict (human, 2026-08-26 session): flipped through all four variants and took the **maximum** — locked token mapping + Geist/Geist Mono + the density probe (tracking, antialiasing, 130ms motion, cobalt focus-ring). Reaction quote: «ок, пойдёт».\n\nArtifact: dynamic Cordis client plugin `owsty-1/pkg-2`, run live against the web GUI — floating variant bar in `shell.overlay` switching token layers via `ctx.theme.overrideTokens` (`{light,dark}` pairs, both themes live under the stock switcher). Captured on branch `research/ow-restyle-proto` → `research-notes/ow-restyle-proto/` (client.js + README).\n\nLimits recorded for the rollout tickets:\n\n- Runtime token layers prove color, typography, and motion only. Geometry density (radii 8/14, paddings, hairline input borders) is not token-reachable in the live GUI (CSS Modules hash class names); the foundation rollout PR must carry it.\n- The 12 token-bypass sites (dsh-ood.3) were not visually judged — the map's fog entry stands.\n- Geist arrived via Google Fonts CDN in the prototype; production self-hosts woff2 (dsh-ood.3, unchanged).\n\nMap updates: the \"acceptance criteria per screen\" fog folded into \"Feasibility verdict and PR-series plan\" (dsh-ood.7 already owns the screenshot-audit checklist); rollout fog now waits on dsh-ood.6 only.","created_at":"2026-08-26T09:31:55Z"},{"id":"01a03d70-d503-72bb-aa87-820e670f5b98","issue_id":"dsh-ood.5","author":"Sereja","text":"## Resolution addendum — density probe defect found after close\n\nHuman report (same session, after the verdict): under the max variant the prompt-editor caret sat ~one character ahead of the typed text. Cause class: the probe's global `body { letter-spacing: -0.005em; text-rendering: optimizeLegibility }` — both are known caret-positioning disturbers in editable fields (the DSH prompt editor is a decorated textarea).\n\nProbe v3 (pkg-3) drops both properties; antialiasing, 130ms motion, and the cobalt focus ring stay. Carried to the rollout tickets: **never apply global letter-spacing / text-rendering to editable surfaces** — scope tracking to non-editable text (headings, labels, micro-labels per the OW scale) or omit it.","created_at":"2026-08-26T09:40:00Z"}],"dsh-t28.3":[{"id":"01a033f0-4ca4-7ac1-974d-4c57b21b3464","issue_id":"dsh-t28.3","author":"Sereja","text":"**Resolution (design decisions):**\n\n1. **Config surface** — `streamable-http` server def gains `auth`:\n   - `auth: { type: 'oauth' }` — browser OAuth 2.1 + PKCE + DCR via the SDK's `OAuthClientProvider`.\n   - `auth: { type: 'bearer', credential: CredentialRef }` — static token resolved through `ctx.credentials`; never inline secrets.\n   - Absent `auth` = anonymous (today's behavior).\n   - Validation (fail-loud at plugin load): unknown `type`; OAuth URLs must be `https://` (`http` only for loopback hosts); `auth.type=bearer` combined with `headers.Authorization` rejected as ambiguous.\n   - No `scopes`/`clientMetadata` overrides in v1 — fog until a real server demands them.\n\n2. **Sign-in flow** — loopback redirect onto the live web host: `GET http://127.0.0.1:<port>/mcp/oauth/callback`, state-gated (CSRF + stray-hit rejection), single global pending slot. Explicit-connect-only: started from the MCP settings UI; background paths (session start, tool listing, reconnect) never open the browser. 300 s flow timeout; re-sign-in invalidates the existing grant and replaces it.\n\n3. **Token storage** — one `GrantRecord` per server at `credentialKey('mcp', '<server>')`, payload `{ version: 1, tokens, clientInformation }` (SDK tokens + DCR client info atomically). Refresh is SDK-automatic via `saveTokens`; a dead refresh token means needs-sign-in. Sign-out = `deleteRecord` + disconnect. Caveat: server name is the credential identity — profiles reusing a name share the grant (profile scoping stays fog).\n\n4. **Non-interactive policy** — skip-and-surface: at start of unattended (headless) runs, a server with dead/missing auth is skipped with a surfaced note (\"server X skipped: sign-in required\"); the run continues. Mid-session `UnauthorizedError` parks the server immediately (needs sign-in, no retry-budget burn); reconnect resumes only after a fresh sign-in.\n\n**Implementation seams (verified in code):** `packages/mcp/mcp-client/src/transport.ts` gains `authProvider` construction (one-option seam on `StreamableHTTPClientTransport`); `connection.ts` must special-case `UnauthorizedError` (park, not backoff — the supervisor today is auth-blind and would burn its attempt budget); the provider lives plugin-side over `ctx.authorization` (`registerFlow` + `notify({url})`) + `ctx.credentials` records. No OAuth/PKCE code exists in the repo today.","created_at":"2026-08-24T13:23:01Z"}],"dsh-t28.2":[{"id":"01a033d3-44bf-72a7-83aa-ed7a32d87592","issue_id":"dsh-t28.2","author":"Sereja","text":"**Resolution (research findings):**\n\n# dsh-t28.2 — TS MCP SDK remote/OAuth capabilities + DSH token storage\n\n## 1. @modelcontextprotocol/sdk (TypeScript) — installed version 1.29.0\n\nLocation: `node_modules/.pnpm/@modelcontextprotocol+sdk@1.29.0_zod@4.4.3/node_modules/@modelcontextprotocol/sdk` (consumed via `packages/mcp/mcp-client` and `packages/subagent/subagent-claude-code`).\n\n**Streamable HTTP client transport — yes, built in.**\n- `StreamableHTTPClientTransport` (`dist/esm/client/streamableHttp.d.ts`), already used by DSH today in `packages/mcp/mcp-client/src/transport.ts`. Also `SSEClientTransport` (deprecated) and a newer `WebSocketClientTransport` in `dist/esm/client/`.\n\n**OAuth 2.1 + PKCE + DCR + refresh — yes, all built into the client SDK** (`dist/esm/client/auth.d.ts`, `auth.js`):\n- `interface OAuthClientProvider` — the one integration seam: `redirectUrl`, `clientMetadata`, `clientInformation()/saveClientInformation()` (DCR persistence), `tokens()/saveTokens()` (token storage), `redirectToAuthorization(url)`, `saveCodeVerifier()/codeVerifier()` (PKCE), optional `state()`, `addClientAuthentication`, `validateResourceURL` (RFC 8707), `invalidateCredentials`, `prepareTokenRequest` (grant customization, incl. client_credentials), `saveDiscoveryState`.\n- `auth(provider, options)` — end-to-end driver: RFC 9728 protected-resource discovery → auth-server metadata discovery → DCR (`registerClient`) → authorize URL with PKCE → code exchange (`exchangeAuthorization`) → `refreshAuthorization`.\n- Granular exported helpers: `discoverOAuthProtectedResourceMetadata`, `discoverAuthorizationServerMetadata`, `discoverOAuthServerInfo`, `registerClient` (RFC 7591 DCR), `startAuthorization`, `exchangeAuthorization`, `refreshAuthorization`, `prepareAuthorizationCodeRequest`, `selectResourceURL`, `UnauthorizedError`.\n- Wiring: `new StreamableHTTPClientTransport(url, { authProvider })` — the transport auto-refreshes expired tokens and calls `redirectToAuthorization` then throws `UnauthorizedError` from `connect()` (documented in `streamableHttp.d.ts` ~lines 60–73).\n- `dist/esm/client/auth-extensions.d.ts`: ready-made providers `ClientCredentialsProvider` (client_secret_basic) and `PrivateKeyJwtProvider` + `createPrivateKeyJwtAuth` — machine-to-machine; **no ready-made interactive/browser provider** (that's app-defined via `OAuthClientProvider`).\n\n**Conclusion: the SDK supplies the entire OAuth protocol; the app only supplies storage, browser opening, and a loopback/deep-link callback.** Repo: https://github.com/modelcontextprotocol/typescript-sdk\n\n## 2. MCP Authorization specification\n\nSpec: https://modelcontextprotocol.io/specification/2025-03-26/basic/authorization (current draft revisions add RFC 9728 resource indicators). Key requirements/recommendations:\n- **OAuth 2.1** is the required authorization framework for remote HTTP servers; **PKCE (RFC 7636) required for all clients** (public clients use it instead of client secrets).\n- Servers issue `401` + `WWW-Authenticate` on the MCP URL; clients perform **RFC 9728 Protected Resource Metadata** discovery (`/.well-known/oauth-protected-resource`) then **Authorization Server Metadata** discovery; **resource indicators (RFC 8707)** bind tokens to the resource.\n- **Dynamic Client Registration (RFC 7591)** is recommended so users need no pre-registered client id/secret; public clients should not use client secrets.\n- Callback/redirect: clients **must** support loopback/`localhost` redirects (no prior registration needed); deep-link/custom-scheme redirects allowed where the platform supports them; `state` for CSRF.\n\n## 3. How others configure remote MCP auth\n\n**Claude Code** (https://code.claude.com/docs/en/mcp): `claude mcp add --transport http <name> <url>` (also `sse`, and `http` servers in `.mcp.json`). On first use it runs an automatic OAuth flow in the browser against the server (spec flow above); `/mcp` shows per-server auth status and a startup notice appears when servers need authentication; tokens are stored in the OS keychain (macOS Keychain); servers requiring pre-registered redirect URIs must list Claude's documented redirect URI conventions.\n\n**Codex CLI** (github.com/openai/codex; community doc mirror https://mintlify.wiki/openai/codex/configuration/mcp-servers): `mcp_servers` in `config.toml` supports stdio and (experimental) `experimental_use_rmcp_client = true` with `url = ...`; auth is **static bearer tokens**, either inline `bearer_token_static = \"...\"` or via `bearer_token_env = \"VAR_NAME\"`. No built-in browser OAuth/DCR flow today.\n\n**openworker (local)** — `openworker/coworker/mcp/oauth.py` + `mcp/config.py`:\n- Config: standard `mcpServers` JSON, layered `~/.config/coworker/mcp.json` + trusted `<workspace>/.coworker/mcp.json`; per-server auth mode key `\"oauth\"` → browser OAuth 2.1 + PKCE + DCR. Plain-text `mcp.json` never holds tokens.\n- Flow: Python SDK's `OAuthClientProvider` (equivalent of the TS seam) drives the spec; app supplies (1) token persistence, (2) browser open (`webbrowser.open`), (3) callback: **loopback** `GET /mcp/oauth/callback` on the sidecar (`http://127.0.0.1:$COWORKER_PORT`, default 8765) resolving a **single-slot pending future** (one sign-in at a time), gated by matching `state` (`secrets.compare_digest`) against stray local hits. 300 s flow timeout.\n- Storage: `SecretStore` profile `mcp-oauth:<server>` holding both `tokens` (access/refresh) and the DCR `client_info` (reused across sign-ins); 0600 file.\n- Notable invariant: `InteractiveAuthRequired` — browser sign-in is explicit-connect-only; background code paths (engine turns, tool listing) raise instead of hijacking the browser (vendor refresh-token rotation, e.g. Atlassian, hit this in practice).\n\n## 4. DSH token-storage seams (local)\n\n**`packages/credentials`** (three sub-packages):\n- `credentials/` — the seam (`ctx.credentials`). Types: `CredentialRef` (POSIX env-name reference carried by config), `CredentialKey` = `<scope>/<id>` (scope = owning plugin's registered name). Record union: `ApiKeyRecord { kind:'api-key', key?, env? }` and **`GrantRecord { kind:'grant', payload: unknown }`** — an owner-opaque JSON blob that \"survives a JSON round trip\" and only the owning plugin can interpret: a natural fit for an OAuth token set + DCR client info. `CredentialProvider` (abstract Service) API: `resolve/describe/set/unset(ref)` for references and `readRecord/describeRecord/listRecords/modifyRecord(key,…)/deleteRecord(key)` for records; `modifyRecord` is the only write path. Events: `credentials/reference-updated`, `credentials/record-updated`.\n- `credentials-local/` — backend: `$DSH_HOME/.credentials.yaml` (0600-enforced, cross-process writer lock, atomic writes, chokidar hot-reload of external edits), layered under the inherited process env and above `.env` files. This is where GrantRecords persist.\n- `authorization/` — **`ctx.authorization`**, purpose-built for exactly this: plugin-owned flows that obtain a credential \"by asking a human — open this page, paste that code, pick an account\". `registerFlow({ key: CredentialKey, label, methods, run(session) })`; `AuthorizationSession` gives `notify({message, url})` (fire-and-forget, e.g. \"Continue in your browser\"), `prompt()`, and an `AbortSignal`; the doc example is literally an OAuth sign-in flow writing a record via credentials. Terminal event `authorization/settled(key, settlement)`.\n\n**Existing OAuth/PKCE in the repo: none.** Grep for `oauth|pkce|authorization code` across `packages/**.ts` finds only unrelated `authorize*`/`unauthorized` identifiers (subagent lineage checks, apiproxy) — no OAuth, PKCE, or browser-flow code exists yet.\n\n**`packages/mcp/mcp-client`** auth hooks today: config schema (src/index.ts) has `transport: 'streamable-http'` with `url: string` and `headers: Record<string,string>` (default `{}`); `transport.ts` passes them as `requestInit.headers` to `StreamableHTTPClientTransport` — **static headers only, no `authProvider`**. `connection.ts` is a reconnect supervisor (backoff, attempt budget, tool-registry sync) with no auth awareness.\n\n## Facts that constrain the design\n\n1. **The TS SDK already implements the full remote-auth stack** (streamable HTTP + OAuth 2.1 + PKCE + DCR + refresh + RFC 9728/8707 discovery) at v1.29.0 — no protocol code needs writing; only an `OAuthClientProvider` implementation (storage + browser redirect + callback) is required.\n2. **The transport seam is one option away**: `new StreamableHTTPClientTransport(url, { authProvider })`; `packages/mcp/mcp-client/src/transport.ts` is the exact insertion point (config gains an auth discriminator next to `headers`).\n3. **DSH already has both halves of the persistence contract**: `GrantRecord { kind:'grant', payload }` under `credentialKey('mcp', '<server>')` in `.credentials.yaml` via `credentials-local`, and the `ctx.authorization` flow surface (`notify({url})` + prompt + signal + `authorization/settled`) designed for browser sign-in — mirroring openworker's SecretStore profile `mcp-oauth:<server>`.\n4. **Callback choice is open**: the SDK leaves `redirectUrl` app-defined; openworker proves the loopback pattern (ephemeral local HTTP server, state-gated single-slot future); Claude Code uses OS keychain + its own redirect conventions; Codex avoids the problem with static bearer env refs.\n5. **Refresh is automatic, interactive sign-in is not**: SDK refreshes via `saveTokens`, but a dead refresh token requires `redirectToAuthorization` → `UnauthorizedError`; openworker's lesson (gate browser opening to explicit user-initiated connects, never background paths) should be adopted via the `ctx.authorization` session/abort semantics.\n6. **Config must carry references, not secrets**: DSH convention (CredentialRef in config, values in the store) rules out Codex-style inline tokens; `bearer_token_env`-style refs can map onto the existing `credentials` resolve seam for non-OAuth static-token servers.\n","created_at":"2026-08-24T12:51:19Z"}]}}</script>
<script>
'use strict'
/* ================= data + derived model (bd ready semantics) ================= */
const RAW = JSON.parse(document.getElementById('bd-data').textContent)
const ISSUES = RAW.issues
const COMMENTS = RAW.comments
const byId = new Map(ISSUES.map(i => [i.id, i]))
/* Group roots are epics — any issue that is a parent (wayfinder maps and plain
   epics alike); the wayfinder:map label also rides on tickets in this store,
   so it cannot identify maps. */
const MAPS = ISSUES.filter(i => ISSUES.some(x => x.parent === i.id))

function blockersOf(id) {
  const i = byId.get(id)
  return (i.dependencies || []).filter(d => d.type === 'blocks').map(d => d.depends_on_id)
}
function childrenOf(id) { return ISSUES.filter(i => i.parent === id).map(i => i.id) }
const isClosed = i => i.status === 'closed'
const inProg = i => i.status === 'in_progress'
function bucketOf(i) {
  if (isClosed(i)) return 'closed'
  if (inProg(i)) return 'progress'
  const bs = blockersOf(i.id)
  return bs.some(b => !isClosed(byId.get(b))) ? 'blocked' : 'frontier'
}
const BUCKET_ZH = { frontier: '可认领', progress: '进行中', blocked: '已阻塞', closed: '已完成' }
const looseIssues = ISSUES.filter(i => !i.parent && !MAPS.some(m => m.id === i.id))
function mapTickets(mid) { return childrenOf(mid) }
function fmtDate(iso) { return (iso || '').slice(0, 10) }
function typeOf(i) { return ((i.labels || []).find(l => l.startsWith('wayfinder:') && l !== 'wayfinder:map') || '').slice(9) }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

/* ================= tiny DOM builder ================= */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') el.className = v
    else if (k === 'html') el.innerHTML = v
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v)
    else if (k === 'style') el.style.cssText = v
    else el.setAttribute(k, v)
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue
    el.append(kid.nodeType ? kid : document.createTextNode(kid))
  }
  return el
}

/* mini markdown: headings, lists, bold, inline code, links */
function md(text) {
  const lines = String(text || '').split('\n')
  const out = []
  let list = null
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
  const flush = () => { if (list) { out.push(h('ul', {}, list.map(x => h('li', { html: inline(x) })))); list = null } }
  for (const ln of lines) {
    const hd = ln.match(/^(#{2,3})\s+(.*)/)
    const li = ln.match(/^\s*[-•]\s+(.*)/)
    if (li) { (list ??= []).push(li[1]); continue }
    flush()
    if (hd) out.push(h(hd[1].length === 2 ? 'h2' : 'h3', { html: inline(hd[2]) }))
    else if (ln.trim()) out.push(h('p', { html: inline(ln) }))
  }
  flush()
  return out
}

/* ================= app state ================= */
const S = {
  variant: 'A',
  dark: false,
  dataState: 'ok', // ok | loading | empty | nobd | nobeads
  tab: 'beads',     // chat | trajectory | beads
  sel: null,
  mapFilter: 'dsh-01e',
  mode: 'list',     // variant A: list | graph
  openGroups: new Set(MAPS.map(m => m.id).concat(['__loose'])),
  focus: null,      // variant B: ego-focus ticket id
  zoom: 1, panX: 0, panY: 0,
  drawer: null,     // variant C: drawer ticket id
  loadedComments: new Set(),
  q: '',
}
const VARIANT_NAMES = { A: '双栏工作台 · list-first', B: '画布优先 · graph-first', C: '泳道看板 · board' }
const app = document.getElementById('app')
let vaListEl = null // search refreshes only the A list, keeping input focus
function render() {
  app.innerHTML = ''
  vaListEl = null
  document.body.toggleAttribute('data-ds-dark-theme', S.dark)
  app.append(renderShell())
}

/* ================= shell: header + tabs + view area ================= */
function renderShell() {
  const beadsAvailable = S.dataState !== 'nobeads'
  if (!beadsAvailable && S.tab === 'beads') S.tab = 'chat' // auto-return (dsh-01e.3)
  const tabs = [
    { id: 'chat', label: '对话' },
    { id: 'trajectory', label: '轨迹' },
    { id: 'beads', label: 'Beads', disabled: !beadsAvailable },
  ]
  const header = h('div', { class: 'shellHeader' },
    h('div', { class: 'shellCrumb' }, 'deepseek-harness · 会话 dsh-01e.4'),
    h('div', { class: 'tabs' }, tabs.map(t => {
      const btn = h('button', {
        class: 'tab' + (S.tab === t.id ? ' tabActive' : '') + (t.disabled ? ' tabDisabled' : ''),
        onClick: () => { if (!t.disabled) { S.tab = t.id; render() } },
      }, t.label)
      if (t.disabled) btn.append(h('span', { class: 'tabTip' }, '此会话仓库没有 .beads/ 任务库'))
      return btn
    })))
  const view = h('div', { class: 'viewArea' })
  if (S.tab !== 'beads') {
    view.append(h('div', { class: 'stateWrap' },
      h('div', { class: 'big' }, S.tab === 'chat' ? '对话视图（真实 GUI 中为聊天记录）' : '轨迹视图（真实 GUI 中为调用轨迹）'),
      h('div', { class: 'hint' }, '本原型只研究 Beads 标签页 — 点击上方「Beads」进入。')))
  } else {
    view.append(renderBeadsView())
  }
  return h('div', { style: 'display:flex;flex-direction:column;height:100%' }, header, view, renderDemoPanel(), renderSwitcher())
}

/* ================= beads view: dispatch by data state ================= */
function renderBeadsView() {
  if (S.dataState === 'loading') return h('div', { style: 'flex:1' },
    h('div', { class: 'skel' }, Array.from({ length: 7 }, (_, k) => h('div', { class: 'skelRow', style: `width:${95 - k * 6}%` }))))
  if (S.dataState === 'empty') return h('div', { class: 'stateWrap' },
    h('div', { class: 'big' }, '任务库为空'),
    h('div', { class: 'hint' }, '此仓库的 .beads/ 中还没有任务。运行 bd create 创建第一个任务。'))

  if (S.dataState === 'nobeads') return h('div', { class: 'stateWrap' },

  return S.variant === 'A' ? renderA() : S.variant === 'B' ? renderB() : renderC()
}

/* ---------- layered DAG layout (prototype stand-in for dagre, dsh-01e.1) ---------- */
function layout(nodes, edges, dir) {
  const ids = new Set(nodes.map(n => n.id))
  const next = new Map(nodes.map(n => [n.id, []]))
  const indeg = new Map(nodes.map(n => [n.id, 0]))
  for (const e of edges) {
    if (!ids.has(e.from) || !ids.has(e.to)) continue
    next.get(e.from).push(e.to)
    indeg.set(e.to, indeg.get(e.to) + 1)
  }
  const layer = new Map(nodes.filter(n => indeg.get(n.id) === 0).map(n => [n.id, 0]))
  const q = [...layer.keys()]
  while (q.length) {
    const id = q.shift()
    for (const t of next.get(id)) {
      const cand = layer.get(id) + 1
      if (!layer.has(t) || layer.get(t) < cand) layer.set(t, cand)
      indeg.set(t, indeg.get(t) - 1)
      if (indeg.get(t) === 0) q.push(t)
    }
  }
  const byLayer = new Map()
  for (const n of nodes) {
    const l = layer.get(n.id) || 0
    if (!byLayer.has(l)) byLayer.set(l, [])
    byLayer.get(l).push(n)
  }
  const pred = new Map(nodes.map(n => [n.id, []]))
  for (const e of edges) if (ids.has(e.from) && ids.has(e.to)) pred.get(e.to).push(e.from)
  const pos = new Map()
  const GAP_N = 26, GAP_L = 78
  if (dir === 'LR') {
    let x = 20
    for (const l of [...byLayer.keys()].sort((a, b) => a - b)) {
      const arr = byLayer.get(l)
      arr.sort((a, b) => String(pred.get(a.id)[0] || '').localeCompare(String(pred.get(b.id)[0] || '')))
      let y = 20, maxW = 0
      for (const n of arr) { pos.set(n.id, { x, y }); y += n.h + GAP_N; maxW = Math.max(maxW, n.w) }
      x += maxW + GAP_L
    }
  } else {
    let y = 20
    for (const l of [...byLayer.keys()].sort((a, b) => a - b)) {
      const arr = byLayer.get(l)
      arr.sort((a, b) => String(pred.get(a.id)[0] || '').localeCompare(String(pred.get(b.id)[0] || '')))
      let x = 20, maxH = 0
      for (const n of arr) { pos.set(n.id, { x, y }); x += n.w + GAP_N; maxH = Math.max(maxH, n.h) }
      y += maxH + GAP_L
    }
  }
  const W = Math.max(...[...pos.values()].map(p => p.x), 0) + 260
  const H = Math.max(...[...pos.values()].map(p => p.y), 0) + 120
  return { pos, W, H }
}

function graphSvg(selIds, opts) {
  const dir = opts.dir || 'TB'
  const selSet = new Set(selIds)
  const nodes = selIds.map(id => {
    const isMap = MAPS.some(m => m.id === id)
    return { id, w: isMap ? 252 : 216, h: isMap ? 50 : 60, map: isMap }
  })
  const edges = []
  const seen = new Set()
  for (const id of selIds) {
    for (const b of blockersOf(id)) if (selSet.has(b) && !seen.has(b + '>' + id)) { seen.add(b + '>' + id); edges.push({ from: b, to: id }) }
    for (const c of childrenOf(id)) if (selSet.has(c) && !seen.has(id + '>' + c)) { seen.add(id + '>' + c); edges.push({ from: id, to: c, pc: true }) }
  }
  const { pos, W, H } = layout(nodes, edges, dir)
  const nById = new Map(nodes.map(n => [n.id, n]))
  const inEgo = id => {
    if (!opts.focus || opts.focus === id) return true
    const f = opts.focus
    return blockersOf(f).includes(id) || blockersOf(id).includes(f) || byId.get(f)?.parent === id || byId.get(id)?.parent === f
  }
  const svgNS = 'http://www.w3.org/2000/svg'
  const mk = (t, at) => { const e = document.createElementNS(svgNS, t); for (const [k, v] of Object.entries(at)) e.setAttribute(k, v); return e }
  const svg = mk('svg', { class: 'graphSvg', viewBox: `0 0 ${W} ${H}` })
  const rootG = mk('g', {})
  svg.append(rootG)
  if (opts.pan) rootG.setAttribute('transform', `translate(${S.panX},${S.panY}) scale(${S.zoom})`)
  const defs = mk('defs', {})
  for (const id of ['arr-blocks', 'arr-pc']) {
    const m = mk('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' })
    m.append(mk('path', { d: 'M 0 1 L 9 5 L 0 9 z', fill: 'var(--gedge)' }))
    defs.append(m)
  }
  rootG.append(defs)
  const anchor = (id, side) => {
    const n = nById.get(id), p = pos.get(id)
    return side === 'out'
      ? (dir === 'LR' ? { x: p.x + n.w, y: p.y + n.h / 2 } : { x: p.x + n.w / 2, y: p.y + n.h })
      : (dir === 'LR' ? { x: p.x, y: p.y + n.h / 2 } : { x: p.x + n.w / 2, y: p.y })
  }
  for (const e of edges) {
    const a = anchor(e.from, 'out'), b = anchor(e.to, 'in')
    const path = dir === 'LR'
      ? `M${a.x},${a.y} C${a.x + 46},${a.y} ${b.x - 46},${b.y} ${b.x},${b.y}`
      : `M${a.x},${a.y} C${a.x},${a.y + 42} ${b.x},${b.y - 42} ${b.x},${b.y}`
    rootG.append(mk('path', { d: path, class: 'gEdge' + (e.pc ? ' pc' : '') + (opts.focus && inEgo(e.from) && inEgo(e.to) ? ' hi' : ''), markerEnd: `url(#${e.pc ? 'arr-pc' : 'arr-blocks'})` }))
  }
  for (const n of nodes) {
    const i = byId.get(n.id)
    const p = pos.get(n.id)
    const g = mk('g', {
      class: 'gNode' + (n.map ? ' mapNode' : '') + ((S.sel === n.id || S.focus === n.id) ? ' sel' : '') + (opts.focus && !inEgo(n.id) ? ' dimmed' : ''),
      transform: `translate(${p.x},${p.y})`,
    })
    const b = bucketOf(i)
    g.append(mk('rect', { class: 'box', width: n.w, height: n.h, rx: 9 }))
    g.append(mk('rect', { x: 0, y: 0, width: 3.5, height: n.h, rx: 2, fill: `var(--gstat-${b})` }))
    const tx = mk('text', { x: 14, y: n.map ? 21 : 19, class: 'title' })
    tx.textContent = (n.map ? '▣ ' : '') + (i.title.length > 30 ? i.title.slice(0, 30) + '…' : i.title)
    g.append(tx)
    const t2 = mk('text', { x: 14, y: n.map ? 38 : 37, class: 'id' })
    t2.textContent = i.id + ' · ' + BUCKET_ZH[b] + ' · P' + i.priority
    g.append(t2)
    g.addEventListener('click', () => (opts.onNode || (id => { S.sel = id; render() }))(n.id))
    rootG.append(g)
  }
  if (opts.pan) attachPan(svg, rootG)
  return { svg, W, H }
}

function attachPan(svg, rootG) {
  let drag = null
  svg.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, px: S.panX, py: S.panY }; svg.classList.add('panning') })
  svg.addEventListener('mousemove', e => {
    if (!drag) return
    S.panX = drag.px + (e.clientX - drag.x)
    S.panY = drag.py + (e.clientY - drag.y)
    rootG.setAttribute('transform', `translate(${S.panX},${S.panY}) scale(${S.zoom})`)
  })
  window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('panning') })
  svg.addEventListener('wheel', e => {
    e.preventDefault()
    S.zoom = Math.min(3, Math.max(.3, S.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)))
    rootG.setAttribute('transform', `translate(${S.panX},${S.panY}) scale(${S.zoom})`)
  }, { passive: false })
}

/* ================= variant A ================= */
function renderA() {
  const tickets = mapTickets(S.mapFilter)
  if (!S.sel || !byId.has(S.sel) || (byId.get(S.sel).parent !== S.mapFilter && S.sel !== S.mapFilter)) {

    body.append(vaListEl, h('div', { class: 'vaDetail' }, detailEl(byId.get(S.sel))))
  } else {
    const g = graphSvg([S.mapFilter, ...mapTickets(S.mapFilter)], { dir: 'TB' })
    body.append(h('div', { class: 'vaGraphPane' },
      h('div', { class: 'graphWrap' }, g.svg, legendEl(), h('div', { class: 'graphHint' }, '点击节点查看详情')),

  }
  return h('div', { class: 'vaRoot' },
    h('div', { class: 'toolbar' },

        h('button', { class: S.mode === 'list' ? 'on' : '', onClick: () => { S.mode = 'list'; render() } }, '列表'),
        h('button', { class: S.mode === 'graph' ? 'on' : '', onClick: () => { S.mode = 'graph'; render() } }, '图表')),
      h('input', {
        class: 'searchBox', placeholder: '搜索任务…', value: S.q,
        onInput: ev => { S.q = ev.target.value; if (vaListEl) { vaListEl.innerHTML = ''; vaListEl.append(...renderAList()) } },
      }),
      h('span', { class: 'countQuiet', style: 'margin-left:auto' }, '显示 ' + ISSUES.length + ' 个任务 · ' + MAPS.length + ' 个分组')),
    body)
}
function renderAList() {
  const q = S.q.toLowerCase()
  const match = i => !q || i.title.toLowerCase().includes(q) || i.id.includes(q)
  const out = []
  const inProgAll = ISSUES.filter(i => inProg(i) && match(i))
  if (inProgAll.length) {
    out.push(h('div', { class: 'subHead', style: 'padding-top:14px' }, '进行中（全部分组）', h('span', { class: 'n' }, inProgAll.length)))
    out.push(...inProgAll.map(i => rowEl(i)))
  }
  const renderMapGroup = m => {
    const tickets = mapTickets(m.id).map(id => byId.get(id)).filter(match)
    if (!tickets.length) return
    const openG = S.openGroups.has(m.id)
    const buckets = { frontier: [], progress: [], blocked: [], closed: [] }
    for (const t of tickets) buckets[bucketOf(t)].push(t)
    const done = buckets.closed.length, active = tickets.length - done
    out.push(h('button', {
      class: 'groupHead' + (openG ? '' : ' closed'),
      onClick: () => { openG ? S.openGroups.delete(m.id) : S.openGroups.add(m.id); render() },
    },
      h('span', { class: 'caret' }, '▼'),
      h('span', { class: 'gt' }, m.title),
      h('span', { class: 'chip' }, active + ' 进行中'),
      done ? h('span', { class: 'countQuiet' }, done + ' 已完成') : null))
    if (openG) {
      for (const b of ['frontier', 'progress', 'blocked']) {
        if (!buckets[b].length) continue
        out.push(h('div', { class: 'subHead' }, BUCKET_ZH[b], h('span', { class: 'n' }, buckets[b].length)))
        out.push(...buckets[b].map(i => rowEl(i)))
      }
      if (buckets.closed.length) {
        const key = m.id + ':c'
        const openC = S.openGroups.has(key)
        out.push(h('button', {
          class: 'subHead asBtn',
          onClick: () => { openC ? S.openGroups.delete(key) : S.openGroups.add(key); render() },
        }, h('span', { style: 'font-size:9px' }, openC ? '▾' : '▸'), '已完成', h('span', { class: 'n' }, buckets.closed.length)))
        if (openC) out.push(...buckets.closed.map(i => rowEl(i)))
      }
    }
  }
  const order = MAPS.some(m => m.id === S.mapFilter) ? [S.mapFilter, ...MAPS.filter(m => m.id !== S.mapFilter).map(m => m.id)] : MAPS.map(m => m.id)
  for (const mid of order) renderMapGroup(byId.get(mid))
  const loose = looseIssues.filter(match)
  if (loose.length) {
    out.push(h('button', {
      class: 'groupHead' + (S.openGroups.has('__loose') ? '' : ' closed'),
      onClick: () => { S.openGroups.has('__loose') ? S.openGroups.delete('__loose') : S.openGroups.add('__loose'); render() },
    }, h('span', { class: 'caret' }, '▼'), h('span', { class: 'gt' }, '独立任务'), h('span', { class: 'chip' }, loose.length)))
    if (S.openGroups.has('__loose')) out.push(...loose.map(i => rowEl(i)))
  }
  return out
}

function renderC() {
  const cols = ['frontier', 'progress', 'blocked', 'closed']
  const isMap = id => MAPS.some(m => m.id === id)
  const board = h('div', { class: 'vcBoard' },

      const colEl = h('div', { class: 'vcCol' },
        h('div', { class: 'vcColHead' }, h('span', { class: 'statDot st-' + b }), BUCKET_ZH[b], h('span', { class: 'countQuiet' }, total)))
      const body = h('div', { class: 'vcColBody' })
      for (const [mid, items] of lanes) {
        if (!items.length) continue
        body.append(h('div', { class: 'laneHead' }, mid === '__loose'
          ? h('span', {}, '独立任务')
          : h('span', { title: byId.get(mid).title }, '▣ ' + byId.get(mid).title)))
        for (const i of items) {
          body.append(h('button', { class: 'card', onClick: () => { S.drawer = i.id; S.sel = i.id; render() } },
            h('div', { class: 'cardTitle' }, i.title),
            h('div', { class: 'cardMeta' }, h('span', { class: 'mono dim' }, i.id), prioMark(i), typeChip(i), attnChip(i))))
        }
      }
      colEl.append(body)
      return colEl
    }))
  const root = h('div', { class: 'vcRoot' },
    h('div', { class: 'toolbar' },
      h('span', { class: 'countQuiet' }, '按状态分列 · 按地图分泳道 · 点击卡片查看详情与自我图'),
      h('span', { class: 'countQuiet', style: 'margin-left:auto' }, '显示 ' + ISSUES.length + ' 个任务')),
    board)
  if (S.drawer && byId.get(S.drawer)) {
    const i = byId.get(S.drawer)
    const egoIds = [i.id, ...blockersOf(i.id), ...ISSUES.filter(x => blockersOf(x.id).includes(i.id)).map(x => x.id), i.parent, ...childrenOf(i.id)].filter(Boolean)
    const g = graphSvg(egoIds, { dir: 'TB', focus: i.id })
    const vw = Math.min(g.W, 470), vh = Math.min(g.H, 280)
    g.svg.setAttribute('viewBox', `0 0 ${g.W} ${g.H}`)
    g.svg.setAttribute('preserveAspectRatio', 'xMidYMin meet')
    g.svg.style.width = '100%'
    g.svg.style.height = vh + 'px'
    root.append(
      h('div', { class: 'drawerMask', onClick: () => { S.drawer = null; render() } }),
      h('div', { class: 'drawer' },
        h('button', { class: 'iconBtn', style: 'position:absolute;top:10px;right:10px', onClick: () => { S.drawer = null; render() } }, '✕'),
        detailEl(i),
        h('div', { class: 'dtSection' }, h('div', { class: 'dtSectionH' }, '自我图 · 1 跳'), h('div', { class: 'egoWrap' }, g.svg))))
  }
  return root
}

/* ================= switcher + demo panel ================= */
function renderSwitcher() {
  const keys = Object.keys(VARIANT_NAMES)
  const cur = keys.indexOf(S.variant)
  const go = d => { S.variant = keys[(cur + d + keys.length) % keys.length]; S.zoom = 1; S.panX = S.panY = 0; render() }
  return h('div', { class: 'switcher' },
    h('button', { onClick: () => go(-1), 'aria-label': '上一个变体' }, '←'),
    h('span', { class: 'lbl' }, S.variant + ' — ' + VARIANT_NAMES[S.variant]),
    h('button', { onClick: () => go(1), 'aria-label': '下一个变体' }, '→'))
}
function renderDemoPanel() {
  return h('div', { class: 'demoPanel' },
    h('label', {}, '深色主题', h('input', { type: 'checkbox', checked: S.dark, onChange: ev => { S.dark = ev.target.checked; render() } })),
    h('label', {}, '数据状态', h('select', { onChange: ev => { S.dataState = ev.target.value; render() } },
      h('option', { value: 'ok' }, '正常数据'),
      h('option', { value: 'loading' }, '加载中'),
      h('option', { value: 'empty' }, '空任务库'),
      h('option', { value: 'nobd' }, 'bd 不可用'),
      h('option', { value: 'nobeads' }, '无 .beads/'))))
}

/* keyboard variant cycling (not in inputs) */
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
  const keys = Object.keys(VARIANT_NAMES)
  S.variant = keys[(keys.indexOf(S.variant) + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length]
  render()
})

render()
</script>
</body>
