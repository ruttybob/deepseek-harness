ndency_count":0,"dependent_count":1,"comment_count":1,"parent":"dsh-ood"},{"id":"dsh-ood.2","title":"OpenWorker design system extracted as an OW-to-DSH token mapping draft","description":"## Question\n\nWhat exact token set does the OpenWorker design language define, and how does it map onto the DSH token scale? Deliver a draft OW→DSH mapping table:\n\n1. Extract the canonical tokens from DESIGN.md (light + dark): palette roles (Paper, Panel White, Ink, Muted Slate, Faint Steel, Hairline/Strong, Work Cobalt, Signal Green/Amber/Red, Deep Teal + soft/line variants), the Geist type scale (sizes/weights/tracking per role), radii, hairline/border rules, shadows, badge soft-tint recipe, motion notes.\n2. Cross-check against the implementation: surfaces/gui tailwind.config.js, src/styles.css, src/tailwind.css — where code diverges from DESIGN.md, DESIGN.md wins but note it.\n3. Map every token onto the --dsw-static-* scale: which DSH vars each OW token replaces, which OW tokens need NEW DSH vars, and what dies (--dsw-static-blue-*, deepseek-*, neutral-bluish duplicates?) under the single-accent canon.\n4. Flag semantic mismatches: places where DSH uses blue/deepseek for meaning (links, selection, focus) that OW expresses via Cobalt or badges.\n\n## Context\n\n- DESIGN.md at the openworker repo root is the single source of truth; its banned list (Inter, serifs, letter-spaced lowercase) applies.\n- ui-mocks/*.html are visual references for the table's intended result.\n- Findings land on branch research/ow-design-extract; the resolution comment links the file.\n","status":"closed","priority":1,"issue_type":"task","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-25T22:27:50Z","created_by":"Sereja","updated_at":"2026-08-25T22:30:21Z","started_at":"2026-08-25T22:27:58Z","closed_at":"2026-08-25T22:30:21Z","close_reason":"Closed","labels":["wayfinder:map","wayfinder:research"],"dependencies":[{"issue_id":"dsh-ood.2","depends_on_id":"dsh-ood","type":"parent-child","created_at":"2026-08-26T01:27:50Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":1,"parent":"dsh-ood"},{"id":"dsh-ood","title":"Wayfinder: port the OpenWorker design language into the DSH web GUI","description":"## Destination\n\nThe DSH web GUI (127.0.0.1:3080, apps/web + packages/client) restyled in the OpenWorker design language — the full system from openworker's DESIGN.md: palette (Paper / Panel White / Ink, Zinc neutrals, single Work Cobalt accent), Geist + Geist Mono typography, 1px hairlines, soft-tinted status badges, token-for-token light and dark themes, plus Cockpit-density/layout patterns on the key surfaces — **landed in the working tree and verified visually at :3080 in both themes**. Execution is carried inside the map (2026-08-26 redraw): once the route clears (token mapping locked, patterns assigned, prototype reacted to), rollout tickets graduate and the map closes only when the port is done, not when the spec is written.\n\n## Notes\n\n**Repos.** Design source: /Users/sergeykostrov/pets/harnesses-ai/ya-ow/openworker (DESIGN.md is the canonical spec; surfaces/gui = Tauri + React + Tailwind implementation, 63 components; ui-mocks/*.html = visual references). Target: this repo — apps/web Vite entry + packages/client (esp. ui-theme: design-platform.css with --dsw-static-* tokens, AppearanceRow light/dark/system switcher).\n\n**Related effort.** dsh-t28 \"Wayfinder: port automations, inbox, and MCP from openworker into DSH\" ports openworker *features*; this map ports the *design language* only. Screens that effort builds will consume the same tokens.\n\n**Skills.** Grilling tickets: /grilling + /domain-modeling. Prototype tickets: /prototype. Research tickets: /research subagents; findings land on throwaway research/ branches in this repo.\n\n**Standing decisions from charting.**\n\n1. Scope: the web GUI only (:3080). dsh-desktop, CLI/TUI are out.\n2. Full design logic including density, applied two-tier: tokens / typography / component styling everywhere; Cockpit density + split-layout patterns only on key surfaces (shell, chat transcript, sidebars, settings), avoiding DOM restructuring where possible.\n3. Both themes, token-for-token mirror of DESIGN.md; the existing light/dark/system switcher keeps working.\n4. *(Redrawn 2026-08-26)* Upstream divergence is accepted: the fork practically never merges deepseek-ai/deepseek-harness, so every decision favors result quality over invasiveness.\n5. Geist + Geist Mono self-hosted (woff2, OFL license).\n6. Pure OW canon: Work Cobalt is the only accent; --dsw-static-blue-* / deepseek-* scales retire from the UI (logo moments excepted if unavoidable).\n7. Rollout: incremental landed series (foundation → components → density → verification), every step buildable and verifiable at :3080.\n8. Done bar: side-by-side screenshot audit of key surfaces vs OW mocks, in light and dark — plus the port actually running at :3080.\n\n**DSH rules that bind every ticket.** Client UI lives as slot plugins under packages/client with CSS Modules + shared tokens; apps/web is a thin Vite entry, not a standalone app. Verifying at :3080 requires rebuilding web artifacts; client-plugin changes hot-reload only while pnpm run dev:web runs.\n\n## Decisions so far\n\n• Web-GUI surface inventory: what restyling touches /dsh-ood.1 — 25 styled packages, 106 CSS modules / 16.3k LOC over the ui-theme token layer; alias refs 1321× vs 12 direct static refs, ~40 hardcoded literals; ≈80–90% of the visual surface is token-reachable. Findings: research/dsh-ui-inventory → research-notes/dsh-ui-inventory.md.\n• OpenWorker design system extracted as an OW-to-DSH token mapping draft /dsh-ood.2 — 21 color tokens/theme + Geist scale + radii/hairlines/badge recipe/motion; ~35 new --dsw-static-* vars (typography/radius/shadow/motion layers are new); blue-*/deepseek-*/duplicate gray ramps die; blue-for-meaning collapses to single Work Cobalt. Findings: research/ow-design-extract → research-notes/ow-design-extract.md.\n• Theme mechanics and Geist self-hosting path in DSH /dsh-ood.3 — dark keyed by data-ds-dark-theme on body (pre-paint inline script, then ThemePresenter); restyle must keep the body{}/body[data-ds-dark-theme]{} pair and --dsw-* names; Geist follows the KaTeX precedent (woff2 in ui-theme styles/fonts, plain CSS side-effect import; existing FONT_EXTENSIONS pipeline emits hashed assets); 12-entry token-bypass list for the mapping to rule on. Findings: research/dsh-theme-mechanics → research-notes/dsh-theme-mechanics.md.\n• Lock the OW-to-DSH token mapping /dsh-ood.4 — DESIGN.md is canon where OW's implementation diverges (Cobalt #2E62D6/#8CAAF2, Muted #5B616B, Faint #9AA1AA); blue-*/deepseek-*/dup-gray ramps die in ONE stroke onto a single OW-anchored Zinc ramp with the alias layer re-pointed atomically; status = ink/soft/line quads (ok/warn/danger/teal) both themes; 7 composite --dsw-static-text-* steps + radius 8/14/9999 + float-only shadow + motion vars; assistant bubbles = neutral solid (#E9EBF0/#2E3138), Cobalt never a large fill; the 12 token-bypass sites deliberately NOT touched here — deferred to a post-prototype cleanup pass.\n• Prototype: key surfaces restyled in OW language /dsh-ood.5 — human took the max variant: locked mapping + Geist + density probe («ок, пойдёт»); runtime token-layer plugin (variant bar in shell.overlay), geometry density deferred to the foundation rollout PR; artifact: research/ow-restyle-proto → research-notes/ow-restyle-proto/.\n\n## Not yet specified\n\n• Execution rollout tickets (foundation → components → density → verification at :3080) — graduate once dsh-ood.6 (Assign OW density and layout patterns) resolves; the destination now carries execution in-map.\n• Token-bypass cleanup pass — the 12 hardcoded sites (boot-page, JsonTree, HoverCard, OnboardingSurface, InputBar, ContextMeter, Rows, TrajectoryTable, katex-error, ansi.ts, shiki.css) deferred by the .4 decision; graduate after the prototype shows which of them matter visually.\n\n## Out of scope\n\n• dsh-desktop and any surface other than the web GUI.\n• CLI/TUI styling.\n• Upstream PR of the redesign to deepseek-ai.\n• Porting OpenWorker *functionality* (Inbox, Connectors screens, Automations UI…) — that is dsh-t28's effort; here only the design language crosses.","notes":"Closed: OpenWorker design system extraction (dsh-ood.2) — OW token set (21 colors/theme + Geist scale + radii/hairlines/badges/motion) mapped to DSH; ~35 new --dsw-static-* vars, blue-*/deepseek-*/duplicate gray ramps die, blue-for-meaning collapses to Work Cobalt; findings: research/ow-design-extract/research-notes/ow-design-extract.md\n\nClosed: Web-GUI surface inventory (dsh-ood.1) — 25 styled packages, 106 CSS modules (16.3k LOC) over ui-theme token sheets; ~80-90% token-reachable via alias remap, restyle tail = boot page, JsonTree, ansi.ts, ~40 hardcoded literals, geometry work; findings: research/dsh-ui-inventory/research-notes/dsh-ui-inventory.md\n\nClosed: Theme mechanics and Geist path (dsh-ood.3) — dark mode is a body[data-ds-dark-theme] attribute (no media query) set pre-paint by an inline boot script and later by ThemePresenter; self-host Geist as plain-CSS-imported woff2 in the Vite graph (KaTeX precedent, assets/fonts/ routing already configured); findings: research/dsh-theme-mechanics/research-notes/dsh-theme-mechanics.md\n\n• Prototype: key surfaces restyled in OW language /dsh-ood.5 — human took the max variant: locked mapping + Geist + density probe («ок, пойдёт»); runtime token-layer plugin (bar in shell.overlay), geometry density deferred to the foundation rollout PR; artifact: research/ow-restyle-proto → research-notes/ow-restyle-proto/.","status":"open","priority":1,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-25T22:27:49Z","created_by":"Sereja","updated_at":"2026-08-26T09:33:10Z","labels":["wayfinder:map"],"dependency_count":0,"dependent_count":0,"comment_count":0},{"id":"dsh-ood.1","title":"Web-GUI surface inventory: what restyling touches","description":"## Question\n\nWhich surfaces make up the DSH web GUI, and how is each styled? Produce the inventory that the token mapping and the pattern assignment will be sliced against:\n\n1. Enumerate the surfaces: shell/layout, chat transcript, composer, settings rows/panels, cordis run panels, tool cards, dialogs, every packages/client/ui-* and packages/extensions/ui-* slot that paints pixels.\n2. For each: styling approach — CSS Modules in-package, shared --dsw-static-* tokens, or hardcoded colors/values bypassing tokens — with rough size (files, LOC of styling).\n3. The dark corners: shiki code theme, KaTeX, scrollbar styling, markdown rendering — where they get their colors.\n4. A size estimate of the total restyle front, split \"token-reachable\" vs \"needs per-package edits\".\n\n## Context\n\n- packages/client/ui-theme/src/styles/design-platform.css defines the --dsw-static-* scale and body[data-ds-dark-theme] overrides; theme preference is light/dark/system via AppearanceRow.\n- apps/web is a thin Vite entry over the @deepseek-ai/dsh-client-web shell; all real UI lives in packages.\n- Findings land on branch research/dsh-ui-inventory; the resolution comment links the file.\n","status":"closed","priority":1,"issue_type":"task","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-25T22:27:49Z","created_by":"Sereja","updated_at":"2026-08-25T22:30:37Z","started_at":"2026-08-25T22:27:58Z","closed_at":"2026-08-25T22:30:37Z","close_reason":"Closed","labels":["wayfinder:map","wayfinder:research"],"dependencies":[{"issue_id":"dsh-ood.1","depends_on_id":"dsh-ood","type":"parent-child","created_at":"2026-08-26T01:27:49Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":1,"parent":"dsh-ood"},{"id":"dsh-01e.4","title":"Prototype: panel UX - wayfinder-aware task list and dependency graph","description":"## Question\n\nHow should the Beads view look and behave? Raise fidelity with a cheap concrete artifact to react to — a static mock or a live stub over real bd data from this repo's `.beads/`:\n\n- Task list: grouping model (frontier first? blocked-on-top per OpenWorker Board? grouped by wayfinder map?), row content (id, title, priority, status icon, labels), attention chips semantics (amber = blocked/review, quiet count otherwise).\n- Dependency graph: node content and sizing, edge rendering (blocks vs parent-child), layering, interaction (click → ego graph / ticket detail, pan/zoom?) — the view owns the full center-column width (tab direction, dsh-01e.3), so sizing answers assume a wide canvas, not a 300–520px rail.\n- Ticket detail: description, status/priority/assignee/labels, comments (loaded on demand), dependency lists.\n- Grey-tab availability presentation (no `.beads/`): the disabled tab + tooltip treatment in the strip.\n- Empty / loading / error states (no `.beads/`, bd missing, huge store) and Chinese product copy.\n\nBlocked by the reader and slot tickets — it consumes their answers.","status":"in_progress","priority":2,"issue_type":"task","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-26T00:59:30Z","created_by":"Sereja","updated_at":"2026-08-26T09:29:54Z","started_at":"2026-08-26T09:29:54Z","labels":["wayfinder:map","wayfinder:prototype"],"dependencies":[{"issue_id":"dsh-01e.4","depends_on_id":"dsh-01e.3","type":"blocks","created_at":"2026-08-26T03:59:31Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-01e.4","depends_on_id":"dsh-01e","type":"parent-child","created_at":"2026-08-26T03:59:30Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-01e.4","depends_on_id":"dsh-01e.1","type":"blocks","created_at":"2026-08-26T09:37:53Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-01e.4","depends_on_id":"dsh-01e.2","type":"blocks","created_at":"2026-08-26T03:59:30Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":3,"dependent_count":0,"comment_count":0,"parent":"dsh-01e"},{"id":"dsh-01e.2","title":"bd reader: canonical data source, liveness, and client wire contract","description":"## Question\n\nHow does the host read bd and feed the panel? Decide:\n\n1. **Canonical data source**: `bd list --all --json -n 0` (structured fields, inline `dependencies[]`/`parent`, conditional-absent fields) vs `bd graph --dot` (DOT text with display-baked labels) vs a mix. `bd graph`'s layered views are display formats — if topological layers are wanted in the UI, are they computed host-side from the JSON edges?\n2. **Package placement and shape**: full capability seam (Service Definition / provider / Consumer) vs a plain host plugin exposing one service; new `packages/` group or an existing one. Who else could consume the reader (CLI, future mutations path) — does that justify the seam today?\n3. **Liveness**: fs.watch `.beads/last-touched` + cheap digest poll (`bd list -n 1` / `updated_at` max) → full refetch on change. Intervals, debounce, pause-when-hidden, and binding to the session cwd (the store follows the session's repo; switching sessions switches stores).\n4. **Wire contract**: client→host RPC pull on demand vs host→client push frames over the existing connection; comment bodies fetched per-issue via `bd show --json --include-comments` only on selection.\n5. **Config surface**: validated Config fields (bd binary resolution, poll interval) — no hardcoded tunables.\n6. **Failure modes**: bd binary missing, no `.beads/` in cwd, store locked by a concurrent writer, very large stores (always `-n 0`; what degrades?).","status":"closed","priority":2,"issue_type":"decision","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-26T00:59:29Z","created_by":"Sereja","updated_at":"2026-08-26T06:39:51Z","started_at":"2026-08-26T06:37:55Z","closed_at":"2026-08-26T06:39:51Z","close_reason":"All four sub-decisions confirmed by dev; reader contract locked","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-01e.2","depends_on_id":"dsh-01e","type":"parent-child","created_at":"2026-08-26T03:59:28Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":1,"parent":"dsh-01e"},{"id":"dsh-01e.3","title":"Panel slot and column integration in AppFrame","description":"## Question\n\nHow does the right panel enter the frame? Decide:\n\n1. **Slot declaration**: name (e.g. `tasks` / `issues`), scope (workspace-scoped like the sidebar vs session-scoped like `details`), owner, SlotMap registration, children it declares (list view, graph view, ticket detail).\n2. **Fourth column in the concession chain** (columns.ts): the contract is \"center >= CENTER_MIN, then details concedes, then auto-closes\" — where does the tasks column sit in that order? Geometry: min/max/default (OpenWorker's 332px default is a data point; our details column is 300–520), and whether the graph gets a two-width reading mode (narrow inspector <-> wide reading, OW pattern) or just the standard clamp range.\n3. **Coexistence with the existing `details` column** (tool-call inspector): both open simultaneously, mutual exclusion, or shared column with a tab ring? The details column is session-scoped; the tasks panel is per-workspace — how do the scopes interplay in one frame?\n4. **Visibility persistence and deep links**: stored preference + transient force-show without clobbering it (OW pattern); where the toggle lives (topbar button, collapsed rail, keyboard).\n5. **Regression surface**: AppFrame/columns contract tests and the layout store — what changes, what must keep passing.","status":"closed","priority":2,"issue_type":"decision","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-26T00:59:29Z","created_by":"Sereja","updated_at":"2026-08-26T09:09:22Z","started_at":"2026-08-26T06:47:44Z","closed_at":"2026-08-26T09:09:22Z","close_reason":"Resolved: Beads is a 'beads' entry (order 20) in the existing conversation.view ring; grey probe-gated tab without .beads/; package dsh-client-ui-beads. Full answer in the resolution comment.","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-01e.3","depends_on_id":"dsh-01e","type":"parent-child","created_at":"2026-08-26T03:59:29Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":1,"parent":"dsh-01e"},{"id":"dsh-01e.1","title":"Graph rendering: hand-rolled layered SVG vs a layout dependency","description":"## Question\n\nHow should the dependency graph be laid out and rendered in the panel: a hand-rolled layered SVG layout (topological columns — `bd graph`'s own LAYER model and OpenWorker's absence of any graph view are the prior art) or a maintained library (@dagrejs/dagre, elkjs, cytoscape, …)?\n\nConstraints that decide it:\n- View sizes: ~5–50 nodes (wayfinder-map subtree, per-ticket ego graph).\n- Typed edges: `blocks` vs `parent-child` (bd dep types) should stay visually distinct.\n- Must fit a dynamic client bundle: tsdown closure, baseline-externals module-graph discipline (packages/client/AGENTS.md) — a new dependency lands in `dependencies` and ships inside `lib/client.js`.\n- Per-file 100% coverage gate applies to any owned layout code.\n- Repo rule: \"prefer maintained dependencies over hand-rolling when they genuinely delete owned code\" — evaluate honestly against a ~150-line layered layout.\n- `bd graph --html` itself embeds D3 as evidence a small lib can carry it, but our panel is native React in the slot system, not an iframe.\n\nDeliverable: verdict (library name or hand-rolled) + evidence (maintenance status, ESM fitness, bundle size, license), and a fallback if the verdict fails at prototype time. Findings land on a throwaway `research/` branch; link it back here.","notes":"branch: research/bd-graph-layout (commit e0f9ad6db6) — research-notes/bd-graph-layout.md","status":"closed","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-26T00:59:28Z","created_by":"Sereja","updated_at":"2026-08-26T06:37:53Z","closed_at":"2026-08-26T06:37:53Z","close_reason":"Research resolved: @dagrejs/dagre v3 chosen as layout dependency; findings on research/bd-graph-layout","labels":["wayfinder:map","wayfinder:research"],"dependencies":[{"issue_id":"dsh-01e.1","depends_on_id":"dsh-01e","type":"parent-child","created_at":"2026-08-26T03:59:27Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":1,"parent":"dsh-01e"},{"id":"dsh-ood.7","title":"Feasibility verdict and PR-series plan","description":"## Question\n\nIs the full port feasible inside the settled constraints — minimal upstream divergence, both themes, incremental PRs — and what is the exact slicing? Decide:\n\n1. The feasibility verdict the effort opened with, now backed by inventory + prototype evidence; any de-scoping needed to keep divergence acceptable.\n2. The PR-series order (foundation: fonts+tokens → components → density), each PR's scope and its screenshot-audit checklist (which surfaces, light+dark, which OW mocks as comparison).\n3. The rollback/pause stance for upstream-merge collisions with restyled files.\n\n## Context\n\n- Inputs: everything closed above. This is the last decision before execution sessions can take over.\n","status":"open","priority":2,"issue_type":"decision","owner":"kostrovsd@gmail.com","created_at":"2026-08-25T22:27:54Z","created_by":"Sereja","updated_at":"2026-08-25T22:27:54Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-ood.7","depends_on_id":"dsh-ood.6","type":"blocks","created_at":"2026-08-26T01:27:57Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-ood.7","depends_on_id":"dsh-ood","type":"parent-child","created_at":"2026-08-26T01:27:54Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":0,"comment_count":0,"parent":"dsh-ood"},{"id":"dsh-ood.6","title":"Assign OW density and layout patterns to surfaces","description":"## Question\n\nWhich OW layout/density patterns go to which DSH surfaces in the second tier? Decide screen-by-screen for the key-surface list: Cockpit Balanced density (13px body, compact panels), split layouts and grid rhythm, panel/micro-label hierarchy, motion restraint. CSS-first per the minimal-divergence stance; DOM changes only where a pattern demands one — name those exceptions explicitly.\n\n## Context\n\n- Input: the prototype reaction (what the human liked/disliked) + the surface inventory.\n- Standing decision #2 fixes the two-tier split; this ticket fills in the per-screen assignments.\n\n## Updates after research closed\n\n- The third-party-conformance question graduated here: extension slot UIs (packages/extensions/ui-*, tool cards, cordis panels) sit on the same --dsw-alias-* layer, so token-level conformance is automatic — decide here only their *density/pattern* tier (full Cockpit treatment vs token-recolor only), screen by screen.\n","status":"open","priority":2,"issue_type":"decision","owner":"kostrovsd@gmail.com","created_at":"2026-08-25T22:27:53Z","created_by":"Sereja","updated_at":"2026-08-25T22:33:06Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-ood.6","depends_on_id":"dsh-ood","type":"parent-child","created_at":"2026-08-26T01:27:53Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-ood.6","depends_on_id":"dsh-ood.5","type":"blocks","created_at":"2026-08-26T01:27:56Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":1,"comment_count":0,"parent":"dsh-ood"},{"id":"dsh-ood.4","title":"Lock the OW-to-DSH token mapping","description":"## Question\n\nWhich final OW→DSH token mapping do we lock? Decide over the drafted table:\n\n1. Token additions/renames/deprecations in design-platform.css (light + dark blocks), including new semantic vars OW needs (hairline-strong, badge soft/line pairs, cobalt accents).\n2. Fate of --dsw-static-blue-* and --dsw-static-deepseek-* under the single-accent canon — full retirement, or a minimal surviving set for logo moments.\n3. Status/badge token shape serving both themes token-for-token.\n4. Geist type-scale tokens: which font-size/weight/tracking triples become vars vs stay per-component CSS.\n\n## Context\n\n- Inputs: the OW token extraction (research/ow-design-extract) and the DSH surface inventory (research/dsh-ui-inventory).\n- Standing decision: pure OW canon, Cobalt the only accent, both themes mirrored.\n","status":"closed","priority":2,"issue_type":"decision","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-25T22:27:52Z","created_by":"Sereja","updated_at":"2026-08-25T23:45:32Z","started_at":"2026-08-25T23:40:47Z","closed_at":"2026-08-25T23:45:32Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-ood.4","depends_on_id":"dsh-ood","type":"parent-child","created_at":"2026-08-26T01:27:51Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-ood.4","depends_on_id":"dsh-ood.2","type":"blocks","created_at":"2026-08-26T01:27:54Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-ood.4","depends_on_id":"dsh-ood.1","type":"blocks","created_at":"2026-08-26T01:27:54Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":2,"dependent_count":1,"comment_count":1,"parent":"dsh-ood"},{"id":"dsh-ood.5","title":"Prototype: key surfaces restyled in OW language","description":"## Question\n\nHow do the key surfaces look and feel once restyled per the locked mapping? Raise fidelity with a cheap, rough, reactable vertical slice — shell + chat transcript + one settings row — in OW styling, light and dark, so the human can react before the wide rollout. Real code on a throwaway branch (or a dynamic Cordis client plugin overriding tokens at runtime) — whatever is cheaper to react to and discard.\n\n## Context\n\n- Inputs: the locked token mapping + the theme-mechanics/font findings (research/dsh-theme-mechanics).\n- This is a prototype to react to, not production code; it may be thrown away after the reaction.\n- Key surfaces per standing decision #2: shell, chat transcript, sidebars, settings.\n","status":"closed","priority":2,"issue_type":"task","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-25T22:27:52Z","created_by":"Sereja","updated_at":"2026-08-26T09:31:55Z","started_at":"2026-08-26T09:08:10Z","closed_at":"2026-08-26T09:31:55Z","close_reason":"Prototype reacted to: max variant chosen (mapping + Geist + density); artifact on research/ow-restyle-proto","labels":["wayfinder:map","wayfinder:prototype"],"dependencies":[{"issue_id":"dsh-ood.5","depends_on_id":"dsh-ood.4","type":"blocks","created_at":"2026-08-26T01:27:55Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-ood.5","depends_on_id":"dsh-ood.3","type":"blocks","created_at":"2026-08-26T01:27:56Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-ood.5","depends_on_id":"dsh-ood","type":"parent-child","created_at":"2026-08-26T01:27:52Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":2,"dependent_count":1,"comment_count":2,"parent":"dsh-ood"},{"id":"dsh-chk.5","title":"Remote MCP auth 5/5: settings auth affordance + keyless runnable example","description":"## Parent\n\ndsh-chk — Remote MCP servers: OAuth and bearer auth\n\n## What to build\n\nMinimal per-server auth surface in the existing settings UI — status chip (anonymous / connected / needs sign-in) with Connect and Sign-out actions — plus the keyless runnable example the repo requires: a scripted fake OAuth MCP server and a client config demonstrating the full cycle (connect → tools → silent refresh → dead-refresh park → re-sign-in) with no account or key. Web browser snapshot coverage for the new affordance.\n\n## Acceptance criteria\n\n- [ ] Settings show per-server auth status: anonymous / connected / needs sign-in\n- [ ] Connect starts the interactive flow; Sign-out deletes the grant and disconnects\n- [ ] Keyless example runs the full cycle (connect → tools → refresh → park → re-sign-in) with zero credentials\n- [ ] Example ships keyless smoke per the examples policy; web snapshot lane covers the status chip and actions\n- [ ] Web snapshot expectations recorded and reviewed; per-file coverage gate green\n\n## Blocked by\n\nRemote MCP auth 3/5 and Remote MCP auth 4/5","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T14:06:16Z","created_by":"Sereja","updated_at":"2026-08-24T14:06:16Z","labels":["ready-for-implement"],"dependencies":[{"issue_id":"dsh-chk.5","depends_on_id":"dsh-chk","type":"parent-child","created_at":"2026-08-24T17:06:16Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-chk.5","depends_on_id":"dsh-chk.4","type":"blocks","created_at":"2026-08-24T17:06:18Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-chk.5","depends_on_id":"dsh-chk.3","type":"blocks","created_at":"2026-08-24T17:06:18Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":2,"dependent_count":0,"comment_count":0,"parent":"dsh-chk"},{"id":"dsh-chk.4","title":"Remote MCP auth 4/5: supervisor park + skip-and-surface for unattended runs","description":"## Parent\n\ndsh-chk — Remote MCP servers: OAuth and bearer auth\n\n## What to build\n\nAuth-aware failure handling in the reconnect supervisor and session bootstrap. An unauthorized error at connect (dead or missing refresh token) parks the server — tools unregistered, status \"needs sign-in\" — without consuming the reconnect attempt budget; recovery is only a fresh sign-in, after which the server reconnects. At the start of a headless run (and session start), servers without usable auth are skipped with a surfaced note naming the server (\"server X skipped: sign-in required\"); the run/session proceeds. All other failure classes keep today's backoff behavior.\n\n## Acceptance criteria\n\n- [ ] Unauthorized connect failure → server parked (tools unregistered, \"needs sign-in\"), reconnect attempt budget untouched\n- [ ] Fresh sign-in on a parked server → reconnects; no restart needed\n- [ ] Backoff behavior unchanged for non-auth failures (process death, network refusal)\n- [ ] Headless run start with a dead-auth server → server skipped, note surfaced in the transcript, run completes\n- [ ] Session start with a dead-auth server → skipped with surfaced note; turn proceeds\n- [ ] Unit specs cover park-not-backoff, budget conservation, recovery, and skip paths; per-file coverage gate green\n\n## Blocked by\n\nRemote MCP auth 2/5: OAuth provider + grant storage on the transport","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T14:06:15Z","created_by":"Sereja","updated_at":"2026-08-24T14:06:15Z","labels":["ready-for-implement"],"dependencies":[{"issue_id":"dsh-chk.4","depends_on_id":"dsh-chk","type":"parent-child","created_at":"2026-08-24T17:06:15Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-chk.4","depends_on_id":"dsh-chk.2","type":"blocks","created_at":"2026-08-24T17:06:17Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":1,"comment_count":0,"parent":"dsh-chk"},{"id":"dsh-chk.2","title":"Remote MCP auth 2/5: OAuth provider + grant storage on the transport","description":"## Parent\n\ndsh-chk — Remote MCP servers: OAuth and bearer auth\n\n## What to build\n\nThe MCP client SDK's provider contract implemented over the credentials store: one grant record per server at scope `mcp`, id `<server>`, payload `{ version: 1, tokens, clientInformation }` replaced atomically. The streamable-HTTP transport is constructed with the auth provider when `auth: oauth` is configured; token refresh persists through the save callback. No protocol code written — the SDK owns discovery, PKCE, DCR, refresh.\n\n## Acceptance criteria\n\n- [ ] A pre-seeded valid grant (tokens + client info) connects to a fake OAuth-protected remote server without any interactive flow; tools are listed\n- [ ] Expired access token + working refresh token: SDK refreshes silently mid-connection; the updated tokens replace the grant record in place\n- [ ] Grant record shape is `{ version: 1, tokens, clientInformation }` under the server's credential key; one record per server, atomic replacement\n- [ ] Re-sign-in (grant overwrite) and sign-out (record deleted, server disconnected) operate on the same single record\n- [ ] Fake authorization server speaks real HTTP on a loopback port; only the external provider boundary is faked\n- [ ] Unit specs + per-file coverage gate green\n\n## Blocked by\n\nRemote MCP auth 1/5: config surface + bearer mode","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T14:06:14Z","created_by":"Sereja","updated_at":"2026-08-24T14:06:14Z","labels":["ready-for-implement"],"dependencies":[{"issue_id":"dsh-chk.2","depends_on_id":"dsh-chk.1","type":"blocks","created_at":"2026-08-24T17:06:16Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-chk.2","depends_on_id":"dsh-chk","type":"parent-child","created_at":"2026-08-24T17:06:13Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":2,"comment_count":0,"parent":"dsh-chk"},{"id":"dsh-chk.3","title":"Remote MCP auth 3/5: interactive sign-in — loopback callback + single-slot flow","description":"## Parent\n\ndsh-chk — Remote MCP servers: OAuth and bearer auth\n\n## What to build\n\nExplicit-connect-only browser sign-in: a loopback GET callback route on the running web app's HTTP server, gated by state; the flow rides the existing authorization-flow service (notify with URL, prompt, abort signal). One global pending sign-in slot; in-flight flows time out after 300 seconds; a second concurrent attempt is rejected with a clear message. Re-sign-in replaces the existing grant; the DCR client registration is reused across sign-ins. Background paths (session start, tool listing, reconnect) never open a browser; headless/CLI-only contexts get an actionable \"start the web UI to sign in\" error instead.\n\n## Acceptance criteria\n\n- [ ] Sign-in started explicitly: browser authorization against the fake server completes via the loopback redirect; server becomes connected; tools listed\n- [ ] Callback requests with wrong/absent state never complete a sign-in\n- [ ] Second concurrent sign-in attempt → rejected with \"sign-in already in progress\"; the first flow is unaffected\n- [ ] In-flight sign-in times out after 300 s; the slot frees; a fresh attempt works\n- [ ] Re-sign-in replaces the previous grant; DCR client info reused (no second registration round)\n- [ ] Session start / tool listing / reconnect with missing auth never opens a browser\n- [ ] Headless or CLI-only context attempting sign-in gets the explicit \"start the web UI\" error\n- [ ] Registry HMR-safety test: disposing the contributing fiber removes the route and pending slot\n\n## Blocked by\n\nRemote MCP auth 2/5: OAuth provider + grant storage on the transport","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T14:06:14Z","created_by":"Sereja","updated_at":"2026-08-24T14:06:14Z","labels":["ready-for-implement"],"dependencies":[{"issue_id":"dsh-chk.3","depends_on_id":"dsh-chk","type":"parent-child","created_at":"2026-08-24T17:06:14Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-chk.3","depends_on_id":"dsh-chk.2","type":"blocks","created_at":"2026-08-24T17:06:17Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":1,"comment_count":0,"parent":"dsh-chk"},{"id":"dsh-chk.1","title":"Remote MCP auth 1/5: config surface + bearer mode","description":"## Parent\n\ndsh-chk — Remote MCP servers: OAuth and bearer auth\n\n## What to build\n\nA remote (streamable-HTTP) MCP server definition gains an `auth` discriminator: `{ type: 'oauth' }`, `{ type: 'bearer', credential: <CredentialRef> }`, or absent for anonymous (today's behavior). Bearer tokens resolve through the credentials store at connect time — never inlined in config. Misconfiguration fails loudly at plugin load with an actionable message.\n\n## Acceptance criteria\n\n- [ ] `auth: bearer` + credential reference: connect succeeds against a token-checking remote server; tools are listed\n- [ ] Referenced credential missing/unresolvable: server fails closed at connect with a clear parked-style error, never an anonymous attempt\n- [ ] No `auth` block: behavior identical to today (anonymous)\n- [ ] Unknown `auth.type` → plugin load fails with the config path in the message\n- [ ] `auth.type=oauth` with non-`https://` URL (except 127.0.0.1/localhost) → load fails\n- [ ] `bearer` combined with a static `Authorization` header → load fails as ambiguous\n- [ ] Unit specs in the package tests directory cover every validation branch; per-file coverage gate green\n\n## Blocked by\n\nNone (can start immediately).","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T14:06:13Z","created_by":"Sereja","updated_at":"2026-08-24T14:06:13Z","labels":["ready-for-implement"],"dependencies":[{"issue_id":"dsh-chk.1","depends_on_id":"dsh-chk","type":"parent-child","created_at":"2026-08-24T17:06:12Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":0,"parent":"dsh-chk"},{"id":"dsh-chk","title":"Remote MCP servers: OAuth and bearer auth","description":"## Problem Statement\n\nA DSH user can configure stdio MCP servers and anonymous streamable-HTTP (remote) servers today, but most real remote servers require authentication. There is no way to sign in: the remote-server config accepts only static headers, no OAuth flow exists anywhere in the product, there is no token storage, and unattended (headless) runs have no defined behavior when a server's credentials are missing or expired. The agent either fails to connect or silently loses the server's tools with no explanation a human can act on.\n\n## Solution\n\nRemote MCP servers become first-class authenticated citizens:\n\n- Adding a remote server by URL offers two auth modes: **OAuth** (browser sign-in via the MCP authorization spec: OAuth 2.1 + PKCE + dynamic client registration) and **bearer** (a static personal token referenced through the credentials store, never inlined in config). No `auth` block means anonymous, as today.\n- The MCP settings surface shows each server's auth status (anonymous / connected / needs sign-in) with an explicit **Connect** action. Connect opens the browser; the provider redirects back to the running web app on a loopback route and the server's tools appear. Sign-out forgets the grant and disconnects.\n- Tokens and registered client info persist in the credentials store and refresh silently; a dead refresh token parks the server as \"needs sign-in\" instead of error-spamming reconnect attempts.\n- Sessions and unattended runs never block on auth: a server without usable credentials is skipped with a surfaced note (\"server X skipped: sign-in required\"), and mid-session auth loss parks that server only — the run continues.\n\n## User Stories\n\n1. As a DSH user, I want to add a remote MCP server by URL, so that I can use its tools without a local process.\n2. As a DSH user, I want to leave `auth` unset for public servers, so that anonymous remote servers keep working exactly as before.\n3. As a DSH user, I want `auth: oauth` on a server, so that I can sign in with my account in the browser instead of pasting tokens.\n4. As a DSH user, I want `auth: bearer` with a credential reference, so that servers which issue personal tokens work without secrets in config files.\n5. As a DSH user, I want to see each server's auth status (anonymous / connected / needs sign-in), so that I know at a glance which servers are usable.\n6. As a DSH user, I want an explicit Connect button that starts sign-in, so that the browser opens only when I asked for it.\n7. As a DSH user, I want the sign-in to return me to the app automatically via a loopback redirect, so that I don't paste codes by hand.\n8. As a DSH user, I want the callback validated by state (CSRF), so that stray or forged local hits can't complete my sign-in.\n9. As a DSH user, I want a second concurrent sign-in attempt rejected with a clear \"sign-in already in progress\" message, so that flows can't interleave.\n10. As a DSH user, I want an in-flight sign-in to time out (5 minutes), so that a forgotten browser tab doesn't wedge the slot forever.\n11. As a DSH user, I want re-signing in to replace the previous grant, so that switching accounts leaves no stale tokens.\n12. As a DSH user, I want Sign-out to delete stored tokens and disconnect the server, so that revocation is one click.\n13. As a DSH user, I want tokens and client registration to persist across app restarts, so that I sign in once per server.\n14. As a DSH user, I want access tokens refreshed silently in the background, so that long sessions don't interrupt on expiry.\n15. As a DSH user, I want a server whose refresh token died to be parked as \"needs sign-in\", so that I see one actionable status instead of a crash loop.\n16. As a DSH user, I want a parked server to reconnect automatically after I re-sign in, so that recovery needs no restart.\n17. As an agent, I want a server without usable credentials to be absent from my tools with a surfaced note, so that my turn proceeds instead of failing.\n18. As an unattended automation run, I want auth-dead servers skipped at start with the skip recorded in the transcript, so that the run completes and the reason is auditable later.\n19. As a DSH user, I want misconfiguration rejected loudly at load (unknown auth type; non-HTTPS OAuth URL except loopback; bearer combined with an Authorization header), so that typos fail at startup, not mid-session.\n20. As a DSH user, I want `http://` accepted for loopback (127.0.0.1 / localhost) server URLs, so that local development servers work.\n21. As a DSH user, I want the dynamically registered client information reused across sign-ins, so that providers don't re-prompt for consent every time.\n22. As a DSH user, I want background paths (session start, tool listing, reconnect) to never open a browser, so that an unattended session can't hijack my desktop.\n23. As a DSH user running headless, I want sign-in attempts to fail with an explicit \"start the web UI to sign in\" message, so that the fix is obvious.\n24. As a repo maintainer, I want the OAuth provider implemented on the existing authorization and credentials services, so that no new storage or browser plumbing is invented.\n25. As a repo maintainer, I want no new session-event surface in this feature, so that the TS/Python SDK parity cost stays zero.\n26. As a repo maintainer, I want a keyless runnable example demonstrating the full flow against a scripted fake OAuth server, so that CI and contributors exercise the feature without accounts.\n27. As a DSH user, I want the sign-in flow's notifications (\"Continue in your browser\") visible in the UI, so that I know what the app is waiting for.\n\n## Implementation Decisions\n\n- **Config surface**: the streamable-HTTP server definition gains an `auth` discriminator — `{ type: 'oauth' }` or `{ type: 'bearer', credential: <CredentialRef> }`; absence means anonymous. Validation is fail-loud at plugin load: unknown `type` rejected; OAuth requires `https://` except loopback hosts; `bearer` combined with a static `Authorization` header rejected as ambiguous. No `scopes`/`clientMetadata` overrides in this spec.\n- **OAuth protocol**: use the MCP client SDK's built-in stack (OAuth 2.1 + PKCE, dynamic client registration, RFC 9728/8707 discovery, automatic refresh). The app implements only the provider contract: token/client-info persistence, browser redirect, and code-Verifier state. No protocol code is written.\n- **Provider persistence**: one grant record per server under the credentials store at scope `mcp`, id `<server>`; payload `{ version: 1, tokens, clientInformation }` replaced atomically. Refresh tokens update the record in place via the provider's save callback. Sign-out deletes the record and disconnects. The server's config name is the credential identity; profiles reusing a name share the grant (accepted caveat; scoping is out of scope).\n- **Interactive flow**: ride the existing authorization-flow service — a plugin-registered flow keyed by the credential, using its notify (with URL), prompt, and abort-signal surface; terminal settlement event closes the pending slot. One global pending sign-in slot; a second concurrent attempt is rejected. In-flight flows time out after 300 seconds. Re-sign-in invalidates and replaces the existing grant.\n- **Callback transport**: a loopback GET route on the web host's HTTP server (`http://127.0.0.1:<port>/mcp/oauth/callback`), gated by state. Sign-in requires the running web app; headless or CLI-only contexts get an explicit actionable error instead of a browser attempt.\n- **Transport wiring**: the streamable-HTTP transport is constructed with the auth provider when `auth` is configured (bearer resolves its credential through the credentials resolve seam at connect time and fails closed with a parked status if the referenced value is missing).\n- **Reconnect supervisor**: an unauthorized error from connect (dead or missing refresh token) parks the server — tools unregistered, status \"needs sign-in\" — without consuming the reconnect attempt budget; recovery is only a fresh sign-in. All other failure classes keep today's backoff behavior.\n- **Unattended policy**: at the start of a headless run (and at session start), servers with dead or missing auth are skipped with a surfaced note naming the server; the run/session proceeds. This is the adopted openworker invariant (its \"interactive auth required\" behavior).\n- **UI surface**: minimal per-server auth status + Connect / Sign-out affordance in the existing settings surface. The full settings-and-tools UI remains a separate open design ticket (per-tool gating + UI prototype).\n\n## Testing Decisions\n\n- Good tests assert external behavior only: validation outcomes on published config, observable park/skip/status behavior, the shape and lifecycle of the stored grant record, callback state-gating. Unit specs live in the package's `tests/` directory (`*.spec.ts`); the repository per-file 100% coverage gate applies to all new source.\n- The OAuth provider is tested against an in-process fake authorization server speaking real HTTP on a loopback port, driven through the SDK's real auth flow — the fake replaces only the external provider boundary (mock only the expensive/non-deterministic boundary, per the testing policy).\n- Reconnect supervisor: inject an unauthorized connect failure and assert park-not-backoff, zero budget consumption, and recovery after re-sign-in; add the registry HMR-safety test (dispose the contributing fiber, assert cleanup) required of every registry.\n- Product-visible behavior ships a keyless runnable example: a scripted fake OAuth MCP server plus a client config exercising connect → tools listed → token refresh → dead-refresh park, runnable without any account or key.\n- Prior art: contract-regression specs in the core agent loop's tests; keyless example smokes per the examples policy; the web browser snapshot lane covers the new settings auth-status affordance.\n\n## Out of Scope\n\n- Per-tool include/exclude gating for MCP servers (open decision ticket in the wayfinder map).\n- The full MCP settings & tools UI redesign (prototype ticket; only the minimal auth status/Connect affordance is in this spec).\n- `scopes` / `clientMetadata` overrides on the OAuth config.\n- Profile- or workspace-scoped server credentials.\n- External notifications (webhook/Telegram) for auth events.\n- MCP server role (DSH exposing itself as a server), Resources & Prompts surfaces, SSE/WebSocket transports.\n- Static tokens inlined in config (credential references only).\n\n## Further Notes\n\n- Derived from the wayfinder map \"Wayfinder: port automations, inbox, and MCP from openworker into DSH\": resolution of the decision ticket \"MCP: remote servers + OAuth design\" and the research ticket \"Research: TS MCP SDK remote/OAuth capabilities + DSH token storage\" (SDK 1.29.0 findings: full remote-auth stack built in; provider contract is the only integration seam).\n- Openworker parity invariants adopted deliberately: single-slot pending sign-in, state-gated loopback callback, DCR client reuse, explicit-connect-only interactivity, skip-and-surface for non-interactive paths.\n- Binding repo rules honored: plugins over core changes (the authorization/credentials seams already exist); no new session events (zero Python-SDK parity cost); fail-loud validated config with no hidden defaults; keyless runnable example required.","status":"open","priority":2,"issue_type":"epic","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T13:48:23Z","created_by":"Sereja","updated_at":"2026-08-24T13:48:23Z","labels":["ready-for-agent"],"dependencies":[{"issue_id":"dsh-chk","depends_on_id":"dsh-t28","type":"related","created_at":"2026-08-24T16:48:23Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":0,"comment_count":0},{"id":"dsh-t28.12","title":"Automations: UI","description":"## Question\n\nWhat does the Automations UI look like? Prototype to react to:\n- Task list: schedule (human-rendered \"Every day at ~7:10 PM\"), next fire, enabled toggle, last status, unread-runs badge.\n- Run history per task: status, trigger (schedule/manual/catchup), duration, result summary, link to the session transcript.\n- Run-now button; create/edit form (title, instructions, cron builder, timezone, workspace).\n- Where parked-approval runs show up (link to Inbox).\n\n## Context\n\n- Templates: `ui-jobs`, `ui-workflow-run`; openworker `surfaces/gui/src/components/ScheduledView.tsx` (508 LOC) for behavior reference.\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:35Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:35Z","labels":["wayfinder:map","wayfinder:prototype"],"dependencies":[{"issue_id":"dsh-t28.12","depends_on_id":"dsh-t28.8","type":"blocks","created_at":"2026-08-24T15:47:03Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.12","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:34Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.12","depends_on_id":"dsh-t28.10","type":"blocks","created_at":"2026-08-24T15:47:04Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":2,"dependent_count":0,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.11","title":"Automations: agent-facing tools in v1?","description":"## Question\n\nDoes v1 expose automation CRUD to the model as tools (`create_scheduled_task`, update/delete/list — openworker parity, approval-gated, with the agent proposing permissions), or are automations user-created only (UI/settings) in v1 with agent tools as fog?\nConsider: approval gating of the create tool itself, standing-grant proposals from the model (risk), and how much of the domain model must exist first.\n\n## Context\n\n- Openworker: `coworker/automation/tools.py` (233 LOC), `requires_approval=True` on create; consent card with proposed read/write permissions.\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:34Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:34Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.11","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:33Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":0,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.10","title":"Automations: run execution pipeline","description":"## Question\n\nDesign the run execution pipeline:\n1. Reuse `packages/bundle/headless` as-is, wrap it, or extract a shared runner? What varies per run (cwd/workspace, profile, opening prompt).\n2. Fresh persisted session per fire (Q7): session naming/linking so the UI can open the transcript.\n3. Opening-prompt framing (openworker: \"the schedule already fired — execute, don't reschedule\").\n4. Terminal statuses and error capture; result summary extraction for the runs list (Q12: in-UI only).\n5. Interaction with approvals mid-run: the run parks asks in the Inbox and keeps waiting — process model for that (ties to the Inbox wait mechanics).\n\n## Context\n\n- `packages/bundle/headless/` — `ctx.agents` fresh agent, one message, quiescence, flush, exit.\n- Openworker: `_run_scheduled_task` in `coworker/server/manager.py` (~L3505).\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:33Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:33Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.10","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:33Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.10","depends_on_id":"dsh-t28.8","type":"blocks","created_at":"2026-08-24T15:47:03Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":1,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.8","title":"Automations: domain model — tasks, runs, storage","description":"## Question\n\nDefine the Automations domain model:\n1. Task record: title, free-text instructions, schedule (5-field cron in an IANA timezone, or one-shot `fire_at`), `max_runs`, enabled, origin (session/user), workspace, `last_run`/`last_status`, `next_run` computation, seen-marks for unread runs.\n2. Run record: status (running/ok/error/skipped), trigger (schedule/manual/catchup), started/finished, result summary, link to the run's session transcript.\n3. Storage: `storage-domain` records vs new `automation/*` session events — price the TS+Python SDK rule; prefer storage.\n4. Binding to Inbox: per-task allow-always grants (Q10: per tool per automation) — where the grant list lives, how the inbox resolution mints it.\n5. Creation approval: creating a task is consequential — gate it through `ctx.approval` like openworker does.\n\n## Context\n\n- Openworker reference: `coworker/automation/models.py` (239 LOC), `store.py` (SQLite) — semantics to keep, storage to replace.\n- Blocked-by the Inbox domain ticket: grant vocabulary and parked-ask binding must match it.\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:32Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:32Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.8","depends_on_id":"dsh-t28.6","type":"blocks","created_at":"2026-08-24T15:47:02Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.8","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:31Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":3,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.9","title":"Automations: scheduler lifecycle in the web host","description":"## Question\n\nDesign the scheduler's lifecycle in the web host:\n1. Owner plugin placement in `packages/host`; start/stop with the host process.\n2. Tick loop and next-run computation per task timezone (croniter-equivalent in TS; clock source).\n3. Catch-up policy for fires missed while `dsh web` wasn't running (openworker: fire once with `trigger=catchup`).\n4. Skip-on-overlap when the previous run is still going; runs spawned, never awaited, so a parked approval can't stall the scheduler.\n5. What happens when the host isn't running at all (documented no-op? external wake?) — align with Q8 (no separate daemon).\n\n## Context\n\n- Openworker reference: `coworker/automation/scheduler.py` (113 LOC) — pure loop + injected runner.\n- DSH `packages/schedule` is session-local only (no cron, no cold sessions) — this is a new subsystem, not an extension of it.\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:32Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:32Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.9","depends_on_id":"dsh-t28.8","type":"blocks","created_at":"2026-08-24T15:47:02Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.9","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:32Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":0,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.7","title":"Inbox: UI","description":"## Question\n\nWhat does the Inbox UI look like? Prototype to react to:\n- Inbox view: pending/resolved, filters by kind/session/run, unread badge.\n- Approval card: full tool call with args (from the enriched payload), allow / deny / always-for-this-automation (Q10 grant), audit trail link.\n- Question card (if questions are in v1 per the domain ticket): options, free text.\n- What happens visually when a parked run resumes after resolution.\n\n## Context\n\n- Templates: `ui-user-questions`, `ui-jobs`; slot-driven client plugins in `packages/client/`.\n- Blocked by the Inbox domain model ticket (kinds and vocabulary feed the cards).\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:31Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:31Z","labels":["wayfinder:map","wayfinder:prototype"],"dependencies":[{"issue_id":"dsh-t28.7","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:30Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.7","depends_on_id":"dsh-t28.6","type":"blocks","created_at":"2026-08-24T15:47:01Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":0,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.6","title":"Inbox: domain model for durable parked approvals","description":"## Question\n\nDefine the Inbox domain model:\n1. Item kinds for v1 (approval; question?) and their payloads (approval carries the enriched request from the core-payload ticket).\n2. State machine: `pending → resolved`, resolve-exactly-once, first-responder-wins, idempotency by `(session, tool_call_id)` for crash-resume.\n3. Durability: `storage-domain` records vs session events (price the TS+Python SDK rule; prefer storage). Copy the `agent-team` mailbox pattern (flush-before-commit, bounded pending) where it fits.\n4. How a parked unattended run *waits*: continuable subagent resumed on resolution? Blocked process in the web host? Session log replay?\n5. Which runs park asks: automations only, any headless run, or also an unattended toggle for interactive sessions (may stay fog)?\n6. Resolution vocabulary → existing `ctx.approval` outcomes mapping, incl. allow-always-per-tool-per-automation (Q10).\n\n## Context\n\n- New plugin (`interaction/approval-inbox` or similar) + the enriched approval request (blocked-by).\n- Openworker reference: `coworker/inbox.py` (384 LOC) — InboxStore, event waiters, resolve-once; `inbox_routing.py` named inboxes (mirrors out of scope here).\n- DSH: `packages/experimental/agent-team/` durable mailbox; `packages/subagent` continuable children; `packages/storage`.\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:30Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:30Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.6","depends_on_id":"dsh-t28.5","type":"blocks","created_at":"2026-08-24T15:47:01Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.6","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:30Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":2,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.4","title":"MCP: settings & tools UI","description":"## Question\n\nWhat does the MCP panel in the Web UI show and do? Produce a rough prototype to react to (per Q4, full GUI is in scope from the start):\n- Server list: state (connected/error/disabled), transport, per-server enable.\n- Tool list per server with individual toggles (the per-tool gating config surface).\n- OAuth connect/sign-out for remote servers (the OAuth design flow).\n- Reload/reconnect affordances.\n\nDecide placement: settings extension areas (`ui-settings-plugins` tab) vs a dedicated view; which client slots; how toggles map to runtime gating.\n\n## Context\n\n- Client plugins in `packages/client/` register into extension slots; `ui-settings`/`ui-settings-plugins` is the settings-tab extension point; RPC via `client/connection` over `host/apiproxy`.\n- Closest templates: `ui-permission-presets`, `ui-jobs`.\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:29Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:29Z","labels":["wayfinder:map","wayfinder:prototype"],"dependencies":[{"issue_id":"dsh-t28.4","depends_on_id":"dsh-t28.3","type":"blocks","created_at":"2026-08-24T15:47:00Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.4","depends_on_id":"dsh-t28.1","type":"blocks","created_at":"2026-08-24T15:46:59Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.4","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:28Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":2,"dependent_count":0,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.5","title":"Core: tool-call arguments in approval requests","description":"## Question\n\nHow do tool-call arguments (and risk context) get into approval requests? Today `ctx.approval.request(req)` carries no tool arguments, which makes any inbox review blind. Decide:\n1. Request schema extension in `packages/interaction/user-approval`: argument payload (full args? redacted summary?), tool name/target, session/run identity.\n2. Secret-redaction policy for args shown to humans and persisted to logs.\n3. Audit events `approval/asked` / `approval/decided` carrying the payload; retention.\n4. Both-SDK (TS + Python) impact; whether anything here needs new session events (avoid if possible — repo rule).\n\nThis is the sanctioned minimal core edit (Q9). Keep it small: enrich the request, don't redesign the waterfall.\n\n## Context\n\n- `packages/interaction/user-approval/src/index.ts`; consumers in `packages/core/tools` and the sandboxed bash tool; README \"Known Limitations\" states requests carry no tool arguments.\n- Openworker passes the full `PermissionRequest` (tool + args) to its approvers (`coworker/engine.py` `_authorize`).\n","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:29Z","created_by":"Sereja","updated_at":"2026-08-24T12:46:29Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.5","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:29Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28.3","title":"MCP: remote servers + OAuth design","description":"## Question\n\nDesign remote (streamable-HTTP) MCP server support with OAuth, on top of the research findings:\n1. Config format: `url`/`headers`/`auth` fields on the server def; validation rules.\n2. Sign-in flow in the Web UI: loopback callback vs deep-link/redirect; where the pending-auth slot lives; explicit-connect-only interactivity (background paths must never hijack the browser).\n3. Token storage: a credentials profile per server (`mcp-oauth:<server>`-style)? Refresh handling?\n4. Non-interactive policy: what happens on expired tokens during session start / unattended runs (openworker: skip the server, raise `InteractiveAuthRequired`-equivalent).\n\nBlocked by the research ticket — read its resolution comment first.\n\n## Context\n\n- `packages/mcp/mcp-client` already speaks streamable-HTTP (`url`/`headers`) without auth.\n- Openworker reference: `coworker/mcp/oauth.py` (OAuth 2.1 + PKCE + DCR), loopback route on the sidecar, single-slot pending future.\n","status":"closed","priority":2,"issue_type":"task","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:28Z","created_by":"Sereja","updated_at":"2026-08-24T13:23:02Z","started_at":"2026-08-24T13:15:54Z","closed_at":"2026-08-24T13:23:02Z","close_reason":"Design settled: oauth|bearer-ref auth config, web-host loopback callback, single-slot explicit-connect sign-in, GrantRecord mcp/<server>, skip-and-surface + instant park on dead auth","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.3","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:27Z","created_by":"Sereja","metadata":"{}"},{"issue_id":"dsh-t28.3","depends_on_id":"dsh-t28.2","type":"blocks","created_at":"2026-08-24T15:46:59Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":1,"dependent_count":1,"comment_count":1,"parent":"dsh-t28"},{"id":"dsh-t28.2","title":"Research: TS MCP SDK remote/OAuth capabilities + DSH token storage","description":"## Question\n\nCollect the facts the OAuth design ticket needs:\n1. What does `@modelcontextprotocol/sdk` (TypeScript) support today for remote servers: streamable HTTP transport, OAuth 2.1 + PKCE, Dynamic Client Registration, token storage/refresh hooks? Exact APIs and versions.\n2. What does the MCP specification require/recommend for remote-server auth (authorization spec, DCR, callbacks)?\n3. How do Claude Code, Codex CLI, and openworker configure remote MCP auth — config keys, sign-in flow (loopback vs deep link), token storage? (openworker: `coworker/mcp/oauth.py` — OAuth 2.1 + PKCE + DCR, loopback callback, SecretStore.)\n4. What does DSH's `packages/credentials` offer for storing and refreshing tokens (record schema, secret store, public API), and is there an existing browser-driven OAuth flow anywhere in the repo?\n\n## Context\n\n- Target repo: `/Users/sergeykostrov/pets/harnesses-ai/deepseek-harness` (`packages/credentials`, `packages/mcp/mcp-client`).\n- Source reference: `/Users/sergeykostrov/pets/harnesses-ai/openworker` (`coworker/mcp/oauth.py`, 240 LOC).\n- Remote servers + OAuth are in scope (Q11). This ticket gathers facts only; the design decision is a separate grilling ticket blocked by this one.\n","status":"closed","priority":2,"issue_type":"task","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:27Z","created_by":"Sereja","updated_at":"2026-08-24T12:51:19Z","started_at":"2026-08-24T12:51:19Z","closed_at":"2026-08-24T12:51:19Z","close_reason":"Closed","labels":["wayfinder:map","wayfinder:research"],"dependencies":[{"issue_id":"dsh-t28.2","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:27Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":1,"parent":"dsh-t28"},{"id":"dsh-t28.1","title":"MCP: per-tool gating — config surface and semantics","description":"## Question\n\nWhere do per-server tool allow/deny lists live, and how do they behave at runtime? Decide:\n1. Config surface: `cordis.yml` plugin fields on `mcp-client` instances (e.g. `tools.include`/`tools.exclude`), a `ctx.settings` namespace, or both (declarative base + user overrides)?\n2. Semantics: include/exclude as allow/deny sets; interaction with `tools/list_changed` generation rebuilds; what happens to a named tool that disappears/reappears on the server.\n3. Runtime toggling without a process restart, and how changes respect the deterministic-composition / KV-cache-prefix logging rule (tool gating changes model-visible input).\n4. Migration/validation story for existing whole-server configs (fail-loud, no hidden defaults).\n\n## Context\n\n- `packages/mcp/mcp-client/` registers every discovered tool on `ctx.tools`; server-qualified names `mcp__<server>__<tool>`; generation replace/rollback already exists for `tools/list_changed`.\n- `packages/guard/repeat-tool-reminder/` has wildcard `include`/`exclude` tool-name patterns (predicates over the live registry) — vocabulary exists, but nothing scopes it per MCP server.\n- cordis.yml tool rows support per-preset `disabled` (see `packages/subagent/` README) — a second existing gating mechanism to reconcile with.\n- `packages/settings/settings/` (`ctx.settings`) has schema/base/user layering — the obvious home for user-side toggles.\n- Openworker parity: per-server `enabled`, `include_tools`/`exclude_tools`, `requires_approval` in `mcp.json` (`coworker/mcp/config.py`).\n\n## Already decided\n\nPer-tool control, settings namespace, and UI are all in scope (map Notes, Q4/Q11). This ticket decides the shape, not whether.\n","status":"in_progress","priority":2,"issue_type":"task","assignee":"Sereja","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:26Z","created_by":"Sereja","updated_at":"2026-08-24T14:09:23Z","started_at":"2026-08-24T14:09:23Z","labels":["wayfinder:grilling","wayfinder:map"],"dependencies":[{"issue_id":"dsh-t28.1","depends_on_id":"dsh-t28","type":"parent-child","created_at":"2026-08-24T15:46:26Z","created_by":"Sereja","metadata":"{}"}],"dependency_count":0,"dependent_count":1,"comment_count":0,"parent":"dsh-t28"},{"id":"dsh-t28","title":"Wayfinder: port automations, inbox, and MCP from openworker into DSH","description":"## Destination\n\nThree openworker features working in the ruttybob/deepseek-harness fork as additive, merge-friendly plugins:\n\n1. **MCP per-tool control** — include/exclude per server, settings + UI, remote (HTTP) servers with OAuth.\n2. **Inbox** — durable cross-session queue where unattended runs park approval asks (tool-call args visible); human resolves from the Web UI.\n3. **Automations** — cron/one-shot scheduled unattended runs in the web host; fresh session + transcript per run; runs list in UI.\n\nThe map is done when the route is clear: every open decision resolved into a spec an execution session can build from. Per Notes, execution may be carried into the map as task tickets once a feature's decision tickets close.\n\n## Notes\n\n**Repos.** Source: `/Users/sergeykostrov/pets/harnesses-ai/openworker` (Python; `coworker/automation/`, `coworker/inbox.py`, `coworker/inbox_routing.py`, `coworker/mcp/`, glue in `coworker/server/manager.py`). Target: `/Users/sergeykostrov/pets/harnesses-ai/deepseek-harness`.\n\n**Porting stance (decided at charting).** Keep openworker *semantics* — run-once catch-up, skip-on-overlap, resolve-once inbox items idempotent by `(session, tool_call_id)`, approval-gated consequential actions, per-task allow-always grants — but implement in DSH idioms on existing seams. Do not port SQLite/JSON-file storage by default.\n\n**DSH rules that bind every ticket.**\n- \"Plugins, not loop changes\": new behavior lands as plugins; extension plugins depend on Service Definitions, never providers.\n- New `SessionEventMap` members require TS + Python SDK updates in the same PR; prefer `storage-domain` records when events aren't needed.\n- Product-visible behavior needs a keyless runnable example.\n- Config is validated, fail-loud, no hidden defaults.\n\n**Key seams found by the DSH survey.**\n- `packages/bundle/headless` — fresh persisted agent, one message, exit (run executor candidate).\n- `packages/host` — web host (`dsh web`), the only always-on process; scheduler home (decided).\n- `packages/interaction/user-approval` — `ctx.approval` waterfall, fail-closed, open-turn-only, no args in requests, one-shot grants only.\n- `packages/mcp/mcp-client` — stdio/HTTP client, `mcp__<server>__<tool>`, reconnect + generation resync; whole-server config only.\n- `packages/settings` (`ctx.settings`), `packages/credentials`, `packages/storage` + `storage-domain`, `packages/client` (`ui-*` slot plugins), `packages/experimental/agent-team` (durable mailbox pattern worth copying).\n\n**Standing decisions from charting (pre-map).**\n- Q1 Destination is working code; execution tickets may enter the map after decisions close.\n- Q2 Feature order: MCP → Inbox → Automations (map is parallel where unblocked).\n- Q4 Full GUI for all three features is in scope from the start.\n- Q5 Merge-friendly: additive plugins, minimal core edits.\n- Q6 Private fork; keep code upstream-PR-clean.\n- Q7 Each fire = a fresh headless run (new session + transcript); \"continue last run\" is manual, later.\n- Q8 Scheduler lives in the web host; no separate daemon.\n- Q9 Inbox = new plugin + sanctioned minimal edits to `user-approval` core.\n- Q10 v1 grants = allow-always per tool per automation (full \"tool target\" grammar is fog).\n- Q11 Remote HTTP MCP servers with OAuth ARE in scope.\n- Q12 v1 result delivery = runs list in Web UI only; external notifications are fog.\n\n**Skills.** HITL tickets: `/grilling` + `/domain-modeling`. Research tickets: `/research`.\n\n**Tracker conventions.** Beads (`bd`). Tickets are children of this issue; blocking via native dependencies (`bd dep`). Claim by assigning before work. Refer to tickets by title, not bare id.\n\n## Decisions so far\n\n- **Research: TS MCP SDK remote/OAuth capabilities + DSH token storage** (dsh-t28.2) — SDK 1.29.0 ships the full remote-auth stack (streamable HTTP + OAuth 2.1 + PKCE + DCR + refresh + RFC 9728/8707); DSH only needs an `OAuthClientProvider` impl — GrantRecord `mcp/<server>` for storage, `ctx.authorization` for the explicit-connect browser flow; `packages/mcp/mcp-client/src/transport.ts` is the one-line insertion seam; config carries refs, never secrets.\n\n## Not yet specified\n\n- Full standing-grant grammar (`tool target` scoping, server-side validation, audit trail) beyond allow-always-per-tool-per-automation — revisit after Inbox + Automations domain decisions land.\n- External notifications for run completion (Telegram/webhook) — parked by Q12; graduates once the run pipeline exists.\n- Unattended toggle for *interactive* sessions (park asks mid-conversation, openworker parity) — may graduate from the Inbox domain ticket.\n- Profile/workspace scoping of automations and MCP servers in a multi-profile host — revisit during the domain-model tickets.\n- Python-SDK parity cost whenever a spec introduces new session events — each spec ticket must price this in or avoid events.\n\n## Out of scope\n\n- MCP **server** role (DSH exposing itself as an MCP server).\n- MCP Resources & Prompts surfaces — client *tools* only in this effort.\n- Inbox channel mirrors (Slack/Telegram transports) — DSH has no connector infra; in-app inbox only.\n- Porting openworker's 25+ native connectors — MCP is the only integration path here.","notes":"- **MCP: remote servers + OAuth design** (dsh-t28.3) — auth: `oauth` | `bearer`+CredentialRef on streamable-http (fail-loud validation); loopback callback on the web host, single-slot explicit-connect-only sign-in; GrantRecord `mcp/<server>` `{version,tokens,clientInformation}`; skip-and-surface for unattended runs, instant park on mid-session UnauthorizedError.\nSpec published from this map (MCP branch, OAuth design resolution): \"Remote MCP servers: OAuth and bearer auth\" — epic, ready-for-agent, linked related.","status":"open","priority":2,"issue_type":"task","owner":"kostrovsd@gmail.com","created_at":"2026-08-24T12:46:25Z","created_by":"Sereja","updated_at":"2026-08-24T13:48:23Z","labels":["wayfinder:map"],"dependency_count":0,"dependent_count":0,"comment_count":0}],"comments":{"dsh-ood.3":[{"id":"01a03b0d-2521-7806-ad2a-eb4de1fc897d","issue_id":"dsh-ood.3","author":"Sereja","text":"Resolved by read-only research. Theme flow: the Host bakes the durable `ui-theme` preference into an inline body script (`bootThemeInjection`, placed before the shell mount, so pre-first-paint) that resolves `system` via `prefers-color-scheme` and toggles the boolean attribute `data-ds-dark-theme` on `<body>` plus root `color-scheme`; there is NO media-query CSS — all palette switching rides the `body` / `body[data-ds-dark-theme]` token block pair in `design-platform.css` (static palette + alias layer, each in light/dark copies). After plugin activation, ui-layout's `ThemePresenter` re-applies the same DOM fields from `theme/change` snapshots, and the Appearance row/store mirror the persisted preference (never the resolved theme) through `settings-store.ts` revision-guarded `sync`.\n\nFonts: follow the KaTeX precedent exactly — woff2 files under `packages/client/ui-theme/src/styles/fonts/` with a `geist.css` imported as a PLAIN CSS side-effect inside the apps/web Vite graph (never the `?inline` `installThemeStyles` path, whose url()s are never rewritten); `vite.config.ts`'s existing FONT_EXTENSIONS/assetFileNames rule already emits hashed fonts to `assets/fonts/`. Prepend `Geist`/`Geist Mono` to the two base.css font tokens; all `packages/client/*` then inherit via `var(--dsw-font-family)`.\n\nAlso captured: 12-entry token-bypass list (hardcoded hex/rgb in CSS Modules, katex.tsx inline #cc0000, ansi.ts rgb strings, shiki hex tokens) and exact rebuild/verify commands (`pnpm run build:web`, `pnpm run dev:web` three-stage watch, smoke-real.e2e + lifecycle-chrome theme scenario screenshots).\n\nFindings: branch `research/dsh-theme-mechanics`, file `research-notes/dsh-theme-mechanics.md` (274 lines, file/line anchors throughout).\n","created_at":"2026-08-25T22:31:52Z"}],"dsh-ood.2":[{"id":"01a03b0b-c08d-709c-a2ae-661ed745408c","issue_id":"dsh-ood.2","author":"Sereja","text":"Extracted the full OpenWorker token set from DESIGN.md (canonical) with implementation cross-check (surfaces/gui styles.css + tailwind.config.js), and mapped it onto the DSH --dsw-static-* scale.\n\nGist: OW defines 21 color tokens per theme (light+dark mirrored: Paper/Panel/Ink/Muted/Faint/Hairline±Strong/Work Cobalt+soft/Signal Green·Amber·Red with soft+line tints/Deep Teal with soft+line), a Geist 7-step type scale (22/18/15/13/12/11·uppercase +0.04em/10px, weights 600/500/400), radii 8/14/9999, 1px hairline borders with no resting shadows (float-only 0 1px 2px rgba(0,0,0,.2)), soft-tint badge recipe, spring-100/20 motion. ~35 NEW --dsw-static-* vars needed (colors, type, radius, shadow, motion — DSH has no type/motion tokens today). Kill-list: all 12 --dsw-static-blue-*, all 11 --dsw-static-deepseek-*, collapse of the neutral-bluish vs neutral duplicate gray ramps, vivid green/amber/red hues, alpha border-l1..l4. Key semantic mismatches: DSH blue/deepseek-for-meaning (links, focus, selection, info buttons, bubbles, label-primary-bluish) all collapse to Work Cobalt as the single accent; status becomes soft-tinted badges only.\n\nNoted divergences (DESIGN.md wins): impl muted #4d535c vs #5B616B, faint #6f7680 vs #9AA1AA, accent #2563eb vs #2E62D6 (dark #4c8dff vs #8CAAF2), warn ink #92400e vs #B45309, impl uses Inter (banned) and a 20/16/14/13/12/11 scale vs Geist 22/18/15/13/12/11/10.\n\nFindings: branch research/ow-design-extract, file research-notes/ow-design-extract.md.\n","created_at":"2026-08-25T22:30:21Z"}],"dsh-ood.1":[{"id":"01a03b0b-fd02-7a44-b96c-2f4dbd059dbf","issue_id":"dsh-ood.1","author":"Sereja","text":"Answer summary (dsh-ood.1): DSH web GUI = apps/web thin Vite entry + 25 styled packages (106 CSS-module files, 16,302 LOC) + ui-theme global token sheets (design-platform.css 338 LOC with --dsw-static-*/--dsw-alias-* + dark block, scrollbar.css, shiki.css, gradient-shadow-text.css, base.css; 706 LOC total). Styling discipline is strong: modules reference var(--dsw-alias-*) 1,321x vs only 12 direct static refs; ~40 non-comment hardcoded color literals total (boot
